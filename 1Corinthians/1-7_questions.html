
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>1 Corinthians Ch. 1–7</title>
    <style>
    body{font-family:Segoe UI,Arial;background:#eef3f8;margin:0;padding:24px}
    .card{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    h1{text-align:center;color:#234}
    #progress{font-weight:bold;color:#666}
    .q{font-size:1.35em;margin:18px 0}
    .opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #bbb;border-radius:8px;background:#fff;text-align:left;font-size:16px;cursor:pointer}
    .opt:hover{background:#eef6ff}.correct{background:#2eaf4a!important;color:#fff}.wrong{background:#d83b3b!important;color:#fff}
    #info{display:none;background:#eef8ff;border-left:5px solid #2d7ef7;padding:16px;margin-top:18px;border-radius:6px}
    #next,#restart{margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#2d7ef7;color:#fff;font-size:16px;cursor:pointer}
    #restart{background:#2eaf4a;display:none}
    .home-btn{display:inline-block;margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#1e3a5f;color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
    .home-btn:hover{opacity:.92}
    </style></head><body><div class="card">
    <h1>📖 1 Corinthians Ch. 1–7</h1><div id="progress"></div><div id="question" class="q"></div><div id="answers"></div>
    <div id="info"></div><button id="next" style="display:none">Next Question</button><div id="result"></div><button id="restart">Play Again</button>
    </div>
    <script>
    let quiz=[
      {"q": "Who reported the quarrels among the Corinthians to Paul?", "answers": [{"text": "The household of Stephanas", "correct": false}, {"text": "Chloe's household", "correct": true}, {"text": "Crispus", "correct": false}, {"text": "Gaius", "correct": false}], "ref": "1 Corinthians 1:11", "verse": "\u201cMy brothers and sisters, some from Chloe's household have informed me that there are quarrels among you.\u201d", "life": "Division in the church is not a private matter; it must be faced, not ignored."},
      {"q": "What does Paul preach, and how do Jews and Gentiles respond?", "answers": [{"text": "The law, which Jews welcome and Gentiles also keep", "correct": false}, {"text": "Signs and wonders, which both groups demand equally", "correct": false}, {"text": "Christ crucified: a stumbling block to Jews and foolishness to Gentiles", "correct": true}, {"text": "Human wisdom, which Gentiles admire and Jews reject", "correct": false}], "ref": "1 Corinthians 1:23", "verse": "\u201cBut we preach Christ crucified: a stumbling block to Jews and foolishness to Gentiles.\u201d", "life": "The cross will never be fashionable; it remains God's power whether people stumble over it or mock it."},
      {"q": "What did God choose in order to shame the wise?", "answers": [{"text": "The powerful things of the world", "correct": false}, {"text": "The foolish things of the world", "correct": true}, {"text": "The noble families of Corinth", "correct": false}, {"text": "The philosophers of this age", "correct": false}], "ref": "1 Corinthians 1:27", "verse": "\u201cBut God chose the foolish things of the world to shame the wise.\u201d", "life": "God's method is not to recruit the impressive, but to shame pride by using what the world despises."},
      {"q": "What did Paul resolve to know among the Corinthians?", "answers": [{"text": "The mystery religions of Corinth", "correct": false}, {"text": "How to speak with eloquence and superior wisdom", "correct": false}, {"text": "Jesus Christ and him crucified", "correct": true}, {"text": "The names of every faction leader", "correct": false}], "ref": "1 Corinthians 2:2", "verse": "\u201cFor I resolved to know nothing while I was with you except Jesus Christ and him crucified.\u201d", "life": "Ministry that lasts is not built on performance, but on a clear hold of Christ crucified."},
      {"q": "If the rulers of this age had understood God's wisdom, what would they not have done?", "answers": [{"text": "Opposed Paul's apostleship", "correct": false}, {"text": "Crucified the Lord of glory", "correct": true}, {"text": "Built temples in Corinth", "correct": false}, {"text": "Followed Apollos instead of Paul", "correct": false}], "ref": "1 Corinthians 2:8", "verse": "\u201cNone of the rulers of this age understood it, for if they had, they would not have crucified the Lord of glory.\u201d", "life": "Worldly power often misses God's wisdom entirely; the cross exposes how blind it is."},
      {"q": "Why does the person without the Spirit not accept the things that come from the Spirit of God?", "answers": [{"text": "They have not been taught by a rabbi", "correct": false}, {"text": "They are foolishness to them and cannot be understood, because they are discerned only through the Spirit", "correct": true}, {"text": "Paul forbade them to hear the gospel", "correct": false}, {"text": "They lack enough education in Greek philosophy", "correct": false}], "ref": "1 Corinthians 2:14", "verse": "\u201cThe person without the Spirit does not accept the things that come from the Spirit of God but considers them foolishness, and cannot understand them because they are discerned only through the Spirit.\u201d", "life": "Spiritual truth is not grasped by intellect alone; the Spirit must open the mind."},
      {"q": "What did Paul have to give the Corinthians, and why?", "answers": [{"text": "Solid food, because they were already mature", "correct": false}, {"text": "Milk, not solid food, because they were still worldly and not ready", "correct": true}, {"text": "The law of Moses, because they were Jews", "correct": false}, {"text": "No teaching at all, because they already knew everything", "correct": false}], "ref": "1 Corinthians 3:1\u20132", "verse": "\u201cI gave you milk, not solid food, for you were not yet ready for it. Indeed, you are still not ready.\u201d", "life": "Jealousy and division are signs of immaturity; growth means becoming able to receive harder truth."},
      {"q": "In the church's growth, who planted, who watered, and who makes it grow?", "answers": [{"text": "Apollos planted, Cephas watered, but Paul made it grow", "correct": false}, {"text": "Paul planted, Apollos watered, but God has been making it grow", "correct": true}, {"text": "Chloe planted, Gaius watered, but Apollos made it grow", "correct": false}, {"text": "Paul planted and watered, and the church made itself grow", "correct": false}], "ref": "1 Corinthians 3:6", "verse": "\u201cI planted the seed, Apollos watered it, but God has been making it grow.\u201d", "life": "Leaders are servants in a field God owns; credit for growth belongs to Him, not to personalities."},
      {"q": "What will test the quality of each person's work?", "answers": [{"text": "The praise of the congregation", "correct": false}, {"text": "Comparison with other apostles", "correct": false}, {"text": "Fire", "correct": true}, {"text": "The wisdom of this age", "correct": false}], "ref": "1 Corinthians 3:13", "verse": "\u201cIt will be revealed with fire, and the fire will test the quality of each person's work.\u201d", "life": "What we build on Christ will be tested; only work that can survive the fire is worth doing."},
      {"q": "How should apostles be regarded, and what is required of those entrusted with the mysteries of God?", "answers": [{"text": "As lords of the church who must be found impressive", "correct": false}, {"text": "As servants of Christ and stewards of the mysteries of God; they must be found faithful", "correct": true}, {"text": "As philosophers who must be found original", "correct": false}, {"text": "As judges of outsiders who must be found severe", "correct": false}], "ref": "1 Corinthians 4:1\u20132", "verse": "\u201cThis, then, is how you ought to regard us: as servants of Christ and as those entrusted with the mysteries God has revealed. Now it is required that those who have been given a trust must prove faithful.\u201d", "life": "The measure of ministry is faithfulness to what God has entrusted, not applause."},
      {"q": "How does Paul describe the apostles' place in the world?", "answers": [{"text": "Seated first at every banquet, honored by all", "correct": false}, {"text": "On display at the end of the procession, like those condemned to die; fools for Christ", "correct": true}, {"text": "Hidden from public view so they would not suffer", "correct": false}, {"text": "Already reigning as kings in Corinth", "correct": false}], "ref": "1 Corinthians 4:9\u201310", "verse": "\u201cFor it seems to me that God has put us apostles on display at the end of the procession, like those condemned to die in the arena.... We are fools for Christ.\u201d", "life": "True apostleship looks like the cross: public humiliation for Christ's sake, not status."},
      {"q": "What sexual immorality was reported among the Corinthians?", "answers": [{"text": "A man has his father's wife", "correct": true}, {"text": "A man has married two sisters", "correct": false}, {"text": "The whole church refused marriage", "correct": false}, {"text": "A man has taken Apollos's wife", "correct": false}], "ref": "1 Corinthians 5:1", "verse": "\u201cIt is actually reported that there is sexual immorality among you, and of a kind that even pagans do not tolerate: A man is sleeping with his father's wife.\u201d", "life": "The church must not baptize scandal as sophistication; some sins even the world still names as shameful."},
      {"q": "What should the church do with that man who is involved in sexual immorality, and to what end?", "answers": [{"text": "Ignore him so that love may abound", "correct": false}, {"text": "Hand him over to Satan so that the spirit may be saved on the day of the Lord", "correct": true}, {"text": "Appoint him as a leader so that grace may be displayed", "correct": false}, {"text": "Send him to the civil courts to be fined", "correct": false}], "ref": "1 Corinthians 5:5", "verse": "\u201cHand this man over to Satan for the destruction of the flesh, so that his spirit may be saved on the day of the Lord.\u201d", "life": "Discipline is not revenge; its aim is restoration and the salvation of the person."},
      {"q": "Whom is the church to judge, and what must they do with the wicked person?", "answers": [{"text": "Judge those outside; welcome the wicked person as a teacher", "correct": false}, {"text": "Judge no one at all; God alone acts in the church", "correct": false}, {"text": "Judge those inside; God judges those outside. Expel the wicked person from among you", "correct": true}, {"text": "Judge the Roman officials; leave church members alone", "correct": false}], "ref": "1 Corinthians 5:12\u201313", "verse": "\u201cWhat business is it of mine to judge those outside the church? Are you not to judge those inside? God will judge those outside. 'Expel the wicked person from among you.'\u201d", "life": "The church is responsible for its own membership; holiness inside is not optional."},
      {"q": "What does Paul say about believers taking each other to court?", "answers": [{"text": "They should choose the most skilled pagan lawyer", "correct": false}, {"text": "The very fact of lawsuits among them means they have been completely defeated already; why not rather be wronged?", "correct": true}, {"text": "Lawsuits prove they are taking holiness seriously", "correct": false}, {"text": "They must always insist on their legal rights first", "correct": false}], "ref": "1 Corinthians 6:7", "verse": "\u201cThe very fact that you have lawsuits among you means you have been completely defeated already. Why not rather be wronged? Why not rather be cheated?\u201d", "life": "Winning against a brother in court can still be a spiritual defeat; the gospel prefers absorbing loss to public disgrace."},
      {"q": "What does Paul say the Lord's people will judge?", "answers": [{"text": "Only disputes inside their own household", "correct": false}, {"text": "The world, and even angels", "correct": true}, {"text": "The temple of Artemis", "correct": false}, {"text": "Nothing; judgment belongs only to Caesar", "correct": false}], "ref": "1 Corinthians 6:2\u20133", "verse": "\u201cOr do you not know that the Lord's people will judge the world?... Do you not know that we will judge angels?\u201d", "life": "If believers will share in such weighty judgment, they ought to handle ordinary disputes among themselves with wisdom."},
      {"q": "Why must they flee sexual immorality in particular?", "answers": [{"text": "Because it is the only sin the law of Moses mentions", "correct": false}, {"text": "Because all other sins a person commits are outside the body, but whoever sins sexually sins against their own body", "correct": true}, {"text": "Because Paul considered marriage itself to be sin", "correct": false}, {"text": "Because the body does not matter to God", "correct": false}], "ref": "1 Corinthians 6:18", "verse": "\u201cFlee from sexual immorality. All other sins a person commits are outside the body, but whoever sins sexually, sins against their own body.\u201d", "life": "Sexual sin is not a private footnote; it is a direct offense against the body God claims."},
      {"q": "What does Paul tell the unmarried and widows?", "answers": [{"text": "They must marry as soon as possible", "correct": false}, {"text": "It is good to stay unmarried, as he does; but if they cannot control themselves, they should marry, for it is better to marry than to burn with passion", "correct": true}, {"text": "Widows may remarry, but the unmarried must not", "correct": false}, {"text": "Marriage is always a failure of faith", "correct": false}], "ref": "1 Corinthians 7:8\u20139", "verse": "\u201cNow to the unmarried and the widows I say: It is good for them to stay unmarried, as I do. But if they cannot control themselves, they should marry, for it is better to marry than to burn with passion.\u201d", "life": "Singleness can be a gift, but it is not a law; self-control and holiness matter more than a preferred status."},
      {"q": "What is true of an unbelieving spouse and the children in a mixed marriage?", "answers": [{"text": "The marriage is invalid and the children are unclean", "correct": false}, {"text": "The unbelieving partner is sanctified through the believing one; otherwise the children would be unclean, but as it is they are holy", "correct": true}, {"text": "The believer must leave at once so the children can be baptized elsewhere", "correct": false}, {"text": "Only the believing parent is holy; the children remain pagans until they choose", "correct": false}], "ref": "1 Corinthians 7:14", "verse": "\u201cFor the unbelieving husband has been sanctified through his wife, and the unbelieving wife has been sanctified through her believing husband. Otherwise your children would be unclean, but as it is, they are holy.\u201d", "life": "A believing presence in a home is not wasted; God treats that marriage and those children as set apart in a real way."},
      {"q": "What should each person do regarding the situation they were in when God called them?", "answers": [{"text": "Change status immediately so they look more spiritual", "correct": false}, {"text": "Remain in the situation they were in when God called them", "correct": true}, {"text": "Leave their work and move to Jerusalem", "correct": false}, {"text": "Seek circumcision or uncircumcision as a new identity", "correct": false}], "ref": "1 Corinthians 7:20", "verse": "\u201cEach person should remain in the situation they were in when God called them.\u201d", "life": "Calling is not an escape from ordinary life; faithfulness begins where you already are."}
    ];
    function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
    shuffle(quiz);quiz.forEach(q=>shuffle(q.answers));
    let i=0,score=0;
    const p=progress,qel=question,ael=answers,info=document.getElementById('info');
    function load(){
    p.textContent=`Question ${i+1} of ${quiz.length}`;
    qel.textContent=quiz[i].q;ael.innerHTML='';info.style.display='none';info.innerHTML='';next.style.display='none';
    quiz[i].answers.forEach(ans=>{
    let b=document.createElement('button');b.className='opt';b.textContent=ans.text;
    b.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    if(ans.correct){b.classList.add('correct');score++;}else{b.classList.add('wrong');document.querySelectorAll('.opt').forEach((x,k)=>{if(quiz[i].answers[k].correct)x.classList.add('correct');});}
    info.style.display='block';
    info.innerHTML=`<b>📖 ${quiz[i].ref}</b><br><em>${quiz[i].verse}</em><hr><b>💡 Life Lesson:</b> ${quiz[i].life}`;
    next.textContent = (i === quiz.length - 1) ? "See your score." : "Next Question";
    next.style.display='inline-block';
    };
    ael.appendChild(b);
    });
    }
    next.onclick=()=>{i++;if(i<quiz.length)load();else{
    document.querySelector('.q').style.display='none';ael.style.display='none';info.style.display='none';next.style.display='none';p.style.display='none';
    result.innerHTML=`<h2>🎉 You scored ${score} / ${quiz.length}</h2>
    <h3>Challenge for This Week</h3>
    <ul><li>Refuse party spirit; belong to Christ, not to personalities.</li><li>Measure wisdom by the cross, not by how impressive it sounds.</li><li>Treat the church as God’s temple; take sin and holiness seriously.</li><li>Prefer being wronged over dragging a brother or sister before unbelievers.</li><li>Honor God with your body, and live faithfully in the calling you have now.</li></ul>
    <p><a class="home-btn" href="../index.html">WisdomHub</a></p>`;
    restart.style.display='inline-block';
    }};
    restart.onclick=()=>location.reload();
    load();
    </script></body></html>
