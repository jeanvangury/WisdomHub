
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>1 Corinthians Ch. 10 &amp; 11:1</title>
    <style>
    body{font-family:Segoe UI,Arial;background:#eef3f8;margin:0;padding:24px}
    .card{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    h1{text-align:center;color:#234}
    #progress{font-weight:bold;color:#666}
    .q{font-size:1.35em;margin:18px 0}
    .opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #bbb;border-radius:8px;background:#fff;text-align:left;font-size:16px;cursor:pointer}
    .opt:hover{background:#eef6ff}.correct{background:#2eaf4a!important;color:#fff}.wrong{background:#d83b3b!important;color:#fff}
    #info{display:none;background:#eef8ff;border-left:5px solid #2d7ef7;padding:16px;margin-top:18px;border-radius:6px}
    #next,#restart{margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#2d7ef7;color:#fff;font-size:16px;cursor:pointer}
    #restart{background:#2eaf4a;display:none}
    .home-btn{display:inline-block;margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#1e3a5f;color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
    .home-btn:hover{opacity:.92}
    </style></head><body><div class="card">
    <h1>📖 1 Corinthians Ch. 10 &amp; 11:1</h1><div id="progress"></div><div id="question" class="q"></div><div id="answers"></div>
    <div id="info"></div><button id="next" style="display:none">Next Question</button><div id="result"></div><button id="restart">Play Again</button>
    </div>
    <script>
    let quiz=[
      {"q": "Paul says all the fathers were under the cloud, passed through the sea, and were baptized into whom?", "answers": [{"text": "Abraham", "correct": false}, {"text": "Moses", "correct": true}, {"text": "Christ", "correct": false}, {"text": "Joshua", "correct": false}], "ref": "1 Corinthians 10:1\u20132", "verse": "\u201cAll our fathers were under the cloud, all passed through the sea, all were baptized into Moses in the cloud and in the sea.\u201d", "life": "Israel\u2019s exodus privileges were real, yet most still fell\u2014baptism and blessing are no substitute for faithfulness."},
      {"q": "What does Paul identify as the spiritual Rock from which Israel drank in the wilderness?", "answers": [{"text": "Moses, who struck the rock at Horeb", "correct": false}, {"text": "Christ", "correct": true}, {"text": "The Spirit present in the cloud and the sea", "correct": false}, {"text": "The law that followed them from Sinai", "correct": false}], "ref": "1 Corinthians 10:4", "verse": "\u201cThey drank of that spiritual Rock that followed them, and that Rock was Christ.\u201d", "life": "Christ was already at work in Israel\u2019s story long before Bethlehem; the gospel runs through the whole Bible."},
      {"q": "Despite shared privileges, what happened to most of the fathers in the wilderness?", "answers": [{"text": "God was well pleased, and they all entered Canaan together", "correct": false}, {"text": "They entered the land but were later scattered among the nations", "correct": false}, {"text": "God was not well pleased, and their bodies were scattered in the wilderness", "correct": true}, {"text": "They were spared because they had eaten the same spiritual food", "correct": false}], "ref": "1 Corinthians 10:5", "verse": "\u201cBut with most of them God was not well pleased, for their bodies were scattered in the wilderness.\u201d", "life": "Shared sacraments and spiritual experiences do not guarantee perseverance; many can start and still fall."},
      {"q": "Paul lists wilderness sins the Corinthians must avoid. Which list matches his warnings?", "answers": [{"text": "Unbelief, Korah\u2019s rebellion, refusing the spies\u2019 report, striking the rock, and withholding the tithe", "correct": false}, {"text": "Lusting after evil things, idolatry, sexual immorality, tempting Christ, and complaining", "correct": true}, {"text": "Making the golden calf, neglecting the Sabbath, intermarriage with Midian, and failing to keep Passover", "correct": false}, {"text": "Covetousness, lying, testing God only at Massah, rejecting the law, and neglecting the feasts", "correct": false}], "ref": "1 Corinthians 10:6\u201310", "verse": "\u201cNow these things became our examples, to the intent that we should not lust after evil things as they also lusted.\u201d", "life": "Scripture records Israel\u2019s failures as warnings, not entertainment\u2014past grace does not cancel present temptation."},
      {"q": "How many fell in one day when some of them committed sexual immorality?", "answers": [{"text": "Three thousand", "correct": false}, {"text": "Twenty-three thousand", "correct": true}, {"text": "Twenty-four thousand", "correct": false}, {"text": "Fourteen thousand seven hundred", "correct": false}], "ref": "1 Corinthians 10:8", "verse": "\u201cNor let us commit sexual immorality, as some of them did, and in one day twenty-three thousand fell.\u201d", "life": "Sin in the camp is never a small matter; what looks like private failure can bring devastating public judgment."},
      {"q": "For what purpose were these wilderness events written, according to Paul?", "answers": [{"text": "To prove that Gentile churches stand where Israel had already fallen", "correct": false}, {"text": "To show that the old covenant had ended before Christ came", "correct": false}, {"text": "As examples and admonition for those upon whom the ends of the ages have come", "correct": true}, {"text": "As a warning intended only for Jews still living under Moses", "correct": false}], "ref": "1 Corinthians 10:11", "verse": "\u201cNow all these things happened to them as examples, and they were written for our admonition, upon whom the ends of the ages have come.\u201d", "life": "We live in the climactic era of redemption; old-testament history was written for churches like ours."},
      {"q": "What warning does Paul give to the person who thinks he stands?", "answers": [{"text": "Take heed lest he fall", "correct": true}, {"text": "Stand firm, for the elect cannot stumble", "correct": false}, {"text": "Examine himself only after others have fallen", "correct": false}, {"text": "Rest, because God will not let him be moved", "correct": false}], "ref": "1 Corinthians 10:12", "verse": "\u201cTherefore let him who thinks he stands take heed lest he fall.\u201d", "life": "Confidence without humility is dangerous; the person most sure of himself may be closest to a fall."},
      {"q": "What does Paul say God will do with temptation?", "answers": [{"text": "Remove the temptation as soon as they pray, so they need not endure it", "correct": false}, {"text": "Allow temptation beyond what they can bear, so they learn dependence", "correct": false}, {"text": "Not allow temptation beyond what they are able, and provide a way of escape so they may bear it", "correct": true}, {"text": "Limit temptation to Satan\u2019s attacks, never to their own desires", "correct": false}], "ref": "1 Corinthians 10:13", "verse": "\u201cGod is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also make the way of escape, that you may be able to bear it.\u201d", "life": "Temptation is real, but never an excuse; God is faithful and always opens a door to endure faithfully."},
      {"q": "Paul asks the Corinthians to judge his argument about the cup and the bread. What do they signify?", "answers": [{"text": "A memorial only of Israel\u2019s passing through the sea", "correct": false}, {"text": "The communion of the blood of Christ and the communion of the body of Christ", "correct": true}, {"text": "Fellowship with one another, without a share in Christ himself", "correct": false}, {"text": "The blessings of Moses\u2019 covenant, now replaced by the Spirit", "correct": false}], "ref": "1 Corinthians 10:16\u201317", "verse": "\u201cThe cup of blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ? For we, though many, are one bread and one body; for we all partake of that one bread.\u201d", "life": "The Lord\u2019s Supper binds believers to Christ and to one another; it is real participation, not a detached symbol."},
      {"q": "Paul uses Israel \u201cafter the flesh\u201d to argue that those who eat of the sacrifices are what?", "answers": [{"text": "Partakers of the altar", "correct": true}, {"text": "Free from any further duty toward God", "correct": false}, {"text": "Priests in the same sense as Aaron\u2019s sons", "correct": false}, {"text": "One loaf with the Gentile nations around them", "correct": false}], "ref": "1 Corinthians 10:18", "verse": "\u201cObserve Israel after the flesh: Are not those who eat of the sacrifices partakers of the altar?\u201d", "life": "Meals tied to worship create real fellowship; participation matters even when the theology is wrong."},
      {"q": "Paul does not say an idol is nothing. What does he say Gentile sacrifices are offered to?", "answers": [{"text": "The true God under another name", "correct": false}, {"text": "Demons, not to God", "correct": true}, {"text": "Nothing at all, since an idol is nothing in the world", "correct": false}, {"text": "The elemental powers Christ has already disarmed", "correct": false}], "ref": "1 Corinthians 10:20", "verse": "\u201cThe things which the Gentiles sacrifice they sacrifice to demons and not to God, and I do not want you to have fellowship with demons.\u201d", "life": "Idol feasts are not neutral cultural events; behind them stands real spiritual fellowship with demons."},
      {"q": "What double participation does Paul declare impossible?", "answers": [{"text": "Blessing the cup of the Lord and eating meat sold in the market", "correct": false}, {"text": "Drinking the cup of the Lord and the cup of demons; partaking of the Lord\u2019s table and the table of demons", "correct": true}, {"text": "Sharing the Lord\u2019s table and sitting at an unbeliever\u2019s ordinary dinner", "correct": false}, {"text": "Partaking of Christ\u2019s body and remembering Israel\u2019s manna in the same meal", "correct": false}], "ref": "1 Corinthians 10:21", "verse": "\u201cYou cannot drink the cup of the Lord and the cup of demons; you cannot partake of the Lord\u2019s table and of the table of demons.\u201d", "life": "You cannot split loyalty between Christ and idol-fellowship; the Lord demands exclusive communion."},
      {"q": "After asking whether we provoke the Lord to jealousy, what rhetorical question does Paul ask?", "answers": [{"text": "Are we stronger than He?", "correct": true}, {"text": "Are we wiser than the fathers in the wilderness?", "correct": false}, {"text": "Are we more holy than Israel under Moses?", "correct": false}, {"text": "Are we free to sin that grace may increase?", "correct": false}], "ref": "1 Corinthians 10:22", "verse": "\u201cOr do we provoke the Lord to jealousy? Are we stronger than He?\u201d", "life": "To flirt with idol fellowship is to arouse the jealousy of God\u2014and no one outmatches him."},
      {"q": "Paul repeats a liberty principle from earlier in the letter. All things are lawful, but not all things are what?", "answers": [{"text": "Profitable (helpful) or edifying", "correct": true}, {"text": "Lawful under the covenant given to Moses", "correct": false}, {"text": "Required of those whose conscience is weak", "correct": false}, {"text": "Clean, if they have first been blessed by a priest", "correct": false}], "ref": "1 Corinthians 10:23", "verse": "\u201cAll things are lawful for me, but not all things are helpful; all things are lawful for me, but not all things edify.\u201d", "life": "Christian freedom is not measured by what you may do, but by what helps and builds others up."},
      {"q": "When buying meat in the market, what does Paul tell the Corinthians to do for conscience\u2019 sake?", "answers": [{"text": "Ask no questions", "correct": true}, {"text": "Ask first whether it was offered to idols", "correct": false}, {"text": "Buy only meat that a priest has cleared", "correct": false}, {"text": "Refuse all meat sold in a Gentile market", "correct": false}], "ref": "1 Corinthians 10:25", "verse": "\u201cEat whatever is sold in the meat market, asking no questions for conscience\u2019 sake.\u201d", "life": "The earth is the Lord\u2019s; ordinary food need not be interrogated as though God\u2019s creation were defiled by default."},
      {"q": "If a host says, \u201cThis was offered to idols,\u201d why should the believer refrain from eating?", "answers": [{"text": "Because the meat itself is now unclean before God", "correct": false}, {"text": "For the sake of the one who told you, and for conscience\u2019 sake", "correct": true}, {"text": "Because Paul forbids every meal in an unbeliever\u2019s house", "correct": false}, {"text": "Because eating it would deny that an idol is nothing in the world", "correct": false}], "ref": "1 Corinthians 10:28", "verse": "\u201cBut if anyone says to you, \u2018This was offered to idols,\u2019 do not eat it for the sake of the one who told you, and for conscience\u2019 sake.\u201d", "life": "Love sometimes means passing on a lawful pleasure so another person\u2019s conscience is not wounded."},
      {"q": "Whose conscience does Paul say he is concerned about when he limits his liberty?", "answers": [{"text": "Only his own, since liberty cannot be judged by another", "correct": false}, {"text": "That of the other person, not his own", "correct": true}, {"text": "That of the church\u2019s leaders, speaking for all", "correct": false}, {"text": "That of both the weak and the strong in every case", "correct": false}], "ref": "1 Corinthians 10:29", "verse": "\u201c\u2018Conscience,\u2019 I say, not your own, but that of the other. For why is my liberty judged by another man\u2019s conscience?\u201d", "life": "Mature freedom serves others; we restrain ourselves when our rights would harm a weaker brother or sister."},
      {"q": "Paul\u2019s supreme principle for eating, drinking, or anything else is what?", "answers": [{"text": "Do all to the glory of God", "correct": true}, {"text": "Give no offense to Jews, Gentiles, or the church of God", "correct": false}, {"text": "Do all that is lawful, for the earth is the Lord\u2019s", "correct": false}, {"text": "Seek not your own profit, but the profit of many", "correct": false}], "ref": "1 Corinthians 10:31", "verse": "\u201cTherefore, whether you eat or drink, or whatever you do, do all to the glory of God.\u201d", "life": "Even ordinary meals become worship when done for God\u2019s glory rather than self-display."},
      {"q": "Paul says he pleases all men in all things, not seeking his own profit, but the profit of many\u2014for what purpose?", "answers": [{"text": "That they may be saved", "correct": true}, {"text": "That they may imitate him as he imitates Christ", "correct": false}, {"text": "That Jews, Gentiles, and the church may never be offended", "correct": false}, {"text": "That his liberty may not be judged by another\u2019s conscience", "correct": false}], "ref": "1 Corinthians 10:33", "verse": "\u201cJust as I also please all men in all things, not seeking my own profit, but the profit of many, that they may be saved.\u201d", "life": "Paul\u2019s adaptability is not people-pleasing for its own sake; it is mission-shaped love aimed at salvation."},
      {"q": "How does Paul close this section before turning to worship instructions in chapter 11?", "answers": [{"text": "\u201cImitate me, just as I also imitate Christ.\u201d", "correct": true}, {"text": "\u201cLet each one seek his own good, that the body may be strong.\u201d", "correct": false}, {"text": "\u201cKeep the traditions I delivered, even when they differ from Christ.\u201d", "correct": false}, {"text": "\u201cBe imitators of Israel, just as they followed Moses.\u201d", "correct": false}], "ref": "1 Corinthians 11:1", "verse": "\u201cImitate me, just as I also imitate Christ.\u201d", "life": "The pattern is Christ first, then the apostle who follows him; imitation of Paul only works when he is imitating Christ."}
    ];
    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        let t=a[i];a[i]=a[j];a[j]=t;
      }
      return a;
    }
    shuffle(quiz);
    let i=0,score=0,tries=0;
    const p=progress,qel=question,ael=answers,info=document.getElementById('info');
    const letters=['A','B','C','D'];
    function reveal(){
    document.querySelectorAll('.opt').forEach((x,k)=>{
    x.disabled=true;
    if(quiz[i].answers[k].correct) x.classList.add('correct');
    });
    info.style.display='block';
    info.innerHTML=`<b>📖 ${quiz[i].ref}</b><br><em>${quiz[i].verse}</em><hr><b>💡 Life Lesson:</b> ${quiz[i].life}`;
    next.textContent = (i === quiz.length - 1) ? "See your score." : "Next Question";
    next.style.display='inline-block';
    }
    function load(){
    tries=0;
    p.textContent=`Question ${i+1} of ${quiz.length}`;
    qel.textContent=quiz[i].q;ael.innerHTML='';info.style.display='none';info.innerHTML='';next.style.display='none';
    shuffle(quiz[i].answers);
    quiz[i].answers.forEach((ans, idx)=>{
    let b=document.createElement('button');b.className='opt';
    let letter=document.createElement('b');letter.textContent=letters[idx]+'. ';
    b.appendChild(letter);b.appendChild(document.createTextNode(ans.text));
    b.onclick=()=>{
    if(ans.correct){
    b.classList.add('correct');
    score++;
    reveal();
    } else {
    b.classList.add('wrong');
    b.disabled=true;
    tries++;
    if(tries===1){
    info.style.display='block';
    info.innerHTML='<b>Pass this question to the next person.</b><br>That option is out. The question is still open — someone else should choose from the remaining answers.';
    next.style.display='none';
    } else {
    reveal();
    }
    }
    };
    ael.appendChild(b);
    });
    }
    next.onclick=()=>{i++;if(i<quiz.length)load();else{
    document.querySelector('.q').style.display='none';ael.style.display='none';info.style.display='none';next.style.display='none';p.style.display='none';
    result.innerHTML=`<h2>🎉 You scored ${score} / ${quiz.length}</h2>
    <h3>Challenge for This Week</h3>
    <ul><li>Take heed if you think you stand; ask God where pride may be hiding.</li><li>When tempted, look for the way of escape God provides instead of debating whether you may sin.</li><li>Let liberty serve love: consider another person\u2019s conscience before insisting on your rights.</li><li>Do one ordinary thing today\u2014a meal, a conversation, a choice\u2014explicitly for God\u2019s glory.</li><li>Imitate Christ by imitating those who imitate him, not those who merely impress you.</li></ul>
    <p><a class="home-btn" href="../index.html">WisdomHub</a></p>`;
    restart.style.display='inline-block';
    }};
    restart.onclick=()=>location.reload();
    load();
    </script></body></html>
