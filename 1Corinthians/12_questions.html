<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>1 Corinthians Ch. 12</title>
    <style>
    body{font-family:Segoe UI,Arial;background:#eef3f8;margin:0;padding:24px}
    .card{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    h1{text-align:center;color:#234}
    #progress{font-weight:bold;color:#666}
    .q{font-size:1.35em;margin:18px 0}
    .opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #bbb;border-radius:8px;background:#fff;text-align:left;font-size:16px;cursor:pointer}
    .opt:hover{background:#eef6ff}.correct{background:#2eaf4a!important;color:#fff}.wrong{background:#d83b3b!important;color:#fff}
    #info{display:none;background:#eef8ff;border-left:5px solid #2d7ef7;padding:16px;margin-top:18px;border-radius:6px}
    #next,#restart{margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#2d7ef7;color:#fff;font-size:16px;cursor:pointer}
    #restart{background:#2eaf4a;display:none}
    .home-btn{display:inline-block;margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#1e3a5f;color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
    .home-btn:hover{opacity:.92}
    </style></head><body><div class="card">
    <h1>📖 1 Corinthians Ch. 12</h1><div id="progress"></div><div id="question" class="q"></div><div id="answers"></div>
    <div id="info"></div><button id="next" style="display:none">Next Question</button><div id="result"></div><button id="restart">Play Again</button>
    </div>
    <script>
    let quiz=[
      {"q": "Which statement matches Paul's test of speech that is truly by the Spirit?", "answers": [{"text": "No one speaking by the Spirit of God calls Jesus accursed, and no one can say that Jesus is Lord except by the Holy Spirit.", "correct": true}, {"text": "No one speaking by the Spirit of God calls Jesus Lord, and no one can say that Jesus is accursed except by the Holy Spirit.", "correct": false}, {"text": "Anyone carried away to dumb idols may still say that Jesus is Lord if the church later approves the words.", "correct": false}, {"text": "No one can say that Jesus is Lord except by the laying on of the apostles' hands, whether or not the Spirit is mentioned.", "correct": false}], "ref": "1 Corinthians 12:2\u20133", "verse": "\u201cNo one speaking by the Spirit of God calls Jesus accursed, and no one can say that Jesus is Lord except by the Holy Spirit.\u201d", "life": "The Spirit never leads anyone to curse Jesus; confessing Him as Lord is the Spirit's work, not a slogan we invent."},
      {"q": "Paul sets three differences beside three who remain the same. Which pairing uses his exact categories?", "answers": [{"text": "Diversities of gifts, but the same Lord; differences of ministries, but the same Spirit; diversities of activities, but the same God who works all in all.", "correct": false}, {"text": "Diversities of gifts, but the same Spirit; differences of ministries, but the same Lord; diversities of activities, but the same God who works all in all.", "correct": true}, {"text": "Diversities of gifts, but the same Spirit; diversities of ministries, but the same God; differences of activities, but the same Lord.", "correct": false}, {"text": "Differences of gifts, but the same Spirit; differences of activities, but the same Lord; diversities of ministries, but the same God who works all in all.", "correct": false}], "ref": "1 Corinthians 12:4\u20136", "verse": "\u201cThere are diversities of gifts, but the same Spirit. There are differences of ministries, but the same Lord. And there are diversities of activities, but it is the same God who works all in all.\u201d", "life": "Gifts, ministries, and activities differ, but they are not rival spiritualities: one Spirit, one Lord, and one God are at work."},
      {"q": "What does Paul say about the manifestation of the Spirit?", "answers": [{"text": "It is given to the apostles alone, for the confirmation of their ministry before the church.", "correct": false}, {"text": "It is given to each one for private edification, and to the church only when tongues are interpreted.", "correct": false}, {"text": "It is given to each one for the profit of all.", "correct": true}, {"text": "It is given to those who seek honor in the assembly, so the best gifts will be seen.", "correct": false}], "ref": "1 Corinthians 12:7", "verse": "\u201cBut the manifestation of the Spirit is given to each one for the profit of all.\u201d", "life": "A manifestation is not a private trophy; the Spirit gives it so the whole church is helped."},
      {"q": "How are the word of wisdom and the word of knowledge given?", "answers": [{"text": "The word of wisdom through the Lord, and the word of knowledge through the Father who works all in all.", "correct": false}, {"text": "The word of knowledge through the Spirit, and the word of wisdom only after one is appointed a teacher.", "correct": false}, {"text": "Wisdom by discerning of spirits, and knowledge by the interpretation of tongues.", "correct": false}, {"text": "The word of wisdom through the Spirit, and the word of knowledge through the same Spirit.", "correct": true}], "ref": "1 Corinthians 12:8", "verse": "\u201cFor to one is given the word of wisdom through the Spirit, to another the word of knowledge through the same Spirit.\u201d", "life": "Wisdom and knowledge are both from the same Spirit; neither gift outranks the Giver or replaces the other."},
      {"q": "Which list follows Paul's order in verses 8\u201310?", "answers": [{"text": "Word of knowledge, word of wisdom, faith, working of miracles, gifts of healings, different kinds of tongues, interpretation of tongues, prophecy, discerning of spirits.", "correct": false}, {"text": "Word of wisdom, word of knowledge, faith, gifts of healings, working of miracles, prophecy, discerning of spirits, different kinds of tongues, interpretation of tongues.", "correct": true}, {"text": "Faith, word of wisdom, word of knowledge, prophecy, working of miracles, gifts of healings, tongues, interpretation, discerning of spirits.", "correct": false}, {"text": "Apostles, prophets, teachers, miracles, gifts of healings, helps, administrations, varieties of tongues.", "correct": false}], "ref": "1 Corinthians 12:8\u201310", "verse": "\u201cFor to one is given the word of wisdom through the Spirit, to another the word of knowledge through the same Spirit, to another faith by the same Spirit, to another gifts of healings by the same Spirit, to another the working of miracles, to another prophecy, to another discerning of spirits, to another different kinds of tongues, to another the interpretation of tongues.\u201d", "life": "The Spirit's gift list and the later list of appointments are not the same catalog; blending them invents an order Paul did not write."},
      {"q": "Who works all these gifts, and how are they distributed?", "answers": [{"text": "The same God who works all in all assigns every gift to every member in equal measure.", "correct": false}, {"text": "One and the same Spirit works all these things, distributing to each one individually as He wills.", "correct": true}, {"text": "The church distributes the gifts, and the Spirit confirms whatever the body agrees to request.", "correct": false}, {"text": "Each believer chooses a manifestation, and God sets that choice in the body as He pleased.", "correct": false}], "ref": "1 Corinthians 12:11", "verse": "\u201cBut one and the same Spirit works all these things, distributing to each one individually as He wills.\u201d", "life": "Gifts are not assigned by ambition or by vote; the same Spirit gives each one as He wills."},
      {"q": "Paul's body analogy and his later word to Corinth do not say the same thing. Which reading is accurate?", "answers": [{"text": "The members, being many, are one body, so also is the church; and each gifted person is Christ individually.", "correct": false}, {"text": "The body is one member, so also is Christ; the Corinthians are many bodies according to their gifts.", "correct": false}, {"text": "The members, being many, are one body, so also is Christ; and the Corinthians are the body of Christ, and members individually.", "correct": true}, {"text": "Jews and Greeks form one body, but slaves and free remain separate members until they all speak with tongues.", "correct": false}], "ref": "1 Corinthians 12:12, 27", "verse": "\u201cAll the members of that one body, being many, are one body, so also is Christ.\u201d \u201cNow you are the body of Christ, and members individually.\u201d", "life": "Union with Christ is what makes many members one body; we do not create that body by agreeing to be alike."},
      {"q": "By what were they baptized into one body, and whom does Paul include?", "answers": [{"text": "By one Spirit \u2014 whether Jews or Greeks, whether slaves or free, whether male or female \u2014 and all were made to drink into one Spirit.", "correct": false}, {"text": "Into Moses in the cloud and in the sea, whether Jews or Greeks, and all drank from the spiritual Rock.", "correct": false}, {"text": "By one Spirit \u2014 whether Jews or Greeks, whether slaves or free \u2014 and all were made to drink into one Spirit.", "correct": true}, {"text": "By water in the name of the apostles, and only those who speak with tongues have been made to drink into one Spirit.", "correct": false}], "ref": "1 Corinthians 12:13", "verse": "\u201cFor by one Spirit we were all baptized into one body\u2014whether Jews or Greeks, whether slaves or free\u2014and have all been made to drink into one Spirit.\u201d", "life": "The same Spirit places Jew and Greek, slave and free, into one body; status in Corinth does not create a second baptism."},
      {"q": "If the foot says, \u201cI am not of the body,\u201d because it is not a hand, and the ear says the same because it is not an eye, what follows?", "answers": [{"text": "Each is therefore not of the body until it receives the gift it envies.", "correct": false}, {"text": "The foot and the ear are excused from the body, and God sets only the eye and the hand as He pleased.", "correct": false}, {"text": "Each is still of the body; God has set the members, each one of them, in the body just as He pleased.", "correct": true}, {"text": "They remain members only if the eye and the hand first admit that they have need of them.", "correct": false}], "ref": "1 Corinthians 12:15\u201316, 18", "verse": "\u201cIf the foot should say, \u2018Because I am not a hand, I am not of the body,\u2019 is it therefore not of the body?\u201d \u201cBut now God has set the members, each one of them, in the body just as He pleased.\u201d", "life": "Saying \u201cI am not of the body\u201d because you are not like a prominent member does not make it so; God placed each member as He pleased."},
      {"q": "Which questions does Paul actually ask to show that sameness would undo the body?", "answers": [{"text": "If the whole body were an eye, where would be the smelling? If the whole were smelling, where would be the hearing? And if they were all one member, the body would at last be at peace.", "correct": false}, {"text": "If the whole body were an eye, where would be the hearing? If the whole were hearing, where would be the smelling? And if they were all one member, where would the body be?", "correct": true}, {"text": "If the whole body were a hand, where would be the foot? If the whole were speaking, where would be the tongues?", "correct": false}, {"text": "If the whole body were an ear, where would be the seeing? If all were apostles, where would be the teachers?", "correct": false}], "ref": "1 Corinthians 12:17, 19", "verse": "\u201cIf the whole body were an eye, where would be the hearing? If the whole were hearing, where would be the smelling?\u201d \u201cAnd if they were all one member, where would the body be?\u201d", "life": "A body of identical parts is no body; the church needs every function God was pleased to set in it."},
      {"q": "Which description matches the two wrong speeches in the body?", "answers": [{"text": "The hand says it is not of the body because it is not a foot, and the eye says it is not of the body because it is not an ear; the feet tell the head, \u201cI have no need of you.\u201d", "correct": false}, {"text": "The head says it is not of the body because it is not a foot; the weaker members tell the eye, \u201cI have no need of you.\u201d", "correct": false}, {"text": "The foot says it is not of the body because it is not a hand, and the ear says it is not of the body because it is not an eye; the eye must not tell the hand, nor the head the feet, \u201cI have no need of you.\u201d", "correct": true}, {"text": "Every member is told to say both \u201cI am not of the body\u201d and \u201cI have no need of you,\u201d so that honor stays evenly spread.", "correct": false}], "ref": "1 Corinthians 12:15\u201316, 21", "verse": "\u201cIf the foot should say, \u2018Because I am not a hand, I am not of the body,\u2019 is it therefore not of the body?\u201d \u201cThe eye cannot say to the hand, \u2018I have no need of you\u2019; nor again the head to the feet, \u2018I have no need of you.\u2019\u201d", "life": "One lie says, \u201cI am not of the body.\u201d The other says, \u201cI have no need of you.\u201d Both deny the body God composed."},
      {"q": "What does Paul say about members that seem weaker or less presentable?", "answers": [{"text": "Members that seem weaker are optional; greater honor belongs to the presentable parts, which have the greater need.", "correct": false}, {"text": "Members that seem weaker are necessary; less honorable parts are given greater honor; unpresentable parts are treated with greater modesty; and God gives greater honor to the part which lacks it.", "correct": true}, {"text": "Less honorable parts should be hidden from care, lest their weakness cause a schism in the body.", "correct": false}, {"text": "Unpresentable parts need no special modesty, because God has already made every part equally public.", "correct": false}], "ref": "1 Corinthians 12:22\u201324", "verse": "\u201cThose members of the body which seem to be weaker are necessary.\u201d \u201cGod composed the body, having given greater honor to that part which lacks it.\u201d", "life": "The parts that seem weak or unpresentable are necessary, and God gives greater honor where it is lacking."},
      {"q": "Why does God compose the body so that greater honor goes to the part that lacks it?", "answers": [{"text": "That the stronger members may direct the rest without depending on them.", "correct": false}, {"text": "That each member may rejoice in its own gift and not be troubled by another's honor.", "correct": false}, {"text": "That there should be no schism in the body, but that the members should have the same care for one another.", "correct": true}, {"text": "That the church may rank varieties of tongues above helps and administrations.", "correct": false}], "ref": "1 Corinthians 12:24\u201325", "verse": "\u201cThat there should be no schism in the body, but that the members should have the same care for one another.\u201d", "life": "God arranges honor in the body to prevent division, so that every member has the same care for the others."},
      {"q": "If one member suffers, and if one member is honored, what does the rest of the body do?", "answers": [{"text": "The weaker members suffer with it; only the apostles rejoice when a member is honored.", "correct": false}, {"text": "All the members suffer with it; or if one member is honored, all the members rejoice with it.", "correct": true}, {"text": "The body stands apart from the suffering so it will not be defiled, and honor stays with the member who received it.", "correct": false}, {"text": "All suffer when a member is honored, and all rejoice when a member suffers, because weakness is the greater gift.", "correct": false}], "ref": "1 Corinthians 12:26", "verse": "\u201cAnd if one member suffers, all the members suffer with it; or if one member is honored, all the members rejoice with it.\u201d", "life": "Shared life means shared pain and shared honor; one member's suffering or recognition belongs to the whole body."},
      {"q": "Which statement tracks what God appointed, what Paul's questions imply, and where he points beyond gifts?", "answers": [{"text": "God appointed first apostles, second teachers, third prophets, then evangelists and pastors. All are to speak with tongues, and the more excellent way is that every member interpret.", "correct": false}, {"text": "God appointed first varieties of tongues, second interpretation, third prophecy, then teachers and apostles. All are workers of miracles, and the more excellent way is knowledge.", "correct": false}, {"text": "God appointed first apostles, second prophets, third teachers, after that miracles, then gifts of healings, helps, administrations, and varieties of tongues. His questions \u2014 Are all apostles, prophets, teachers, or workers of miracles? Do all have gifts of healings, speak with tongues, or interpret? \u2014 expect no. Earnestly desire the best gifts, and yet he shows a more excellent way.", "correct": true}, {"text": "God appointed first apostles, second prophets, third teachers, then helps, administrations, miracles, and healings, and He commands that all speak with tongues. The more excellent way is to keep the traditions delivered in chapter 11.", "correct": false}], "ref": "1 Corinthians 12:28\u201331", "verse": "\u201cGod has appointed these in the church: first apostles, second prophets, third teachers, after that miracles, then gifts of healings, helps, administrations, varieties of tongues.\u201d \u201cBut earnestly desire the best gifts. And yet I show you a more excellent way.\u201d", "life": "Not all are apostles, not all speak in tongues, and not all interpret; desire what is best, and still follow the more excellent way."}
    ];
    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        let t=a[i];a[i]=a[j];a[j]=t;
      }
      return a;
    }
    shuffle(quiz);
    let i=0,score=0,tries=0;
    const p=progress,qel=question,ael=answers,info=document.getElementById('info');
    const letters=['A','B','C','D'];
    function reveal(){
    document.querySelectorAll('.opt').forEach((x,k)=>{
    x.disabled=true;
    if(quiz[i].answers[k].correct) x.classList.add('correct');
    });
    info.style.display='block';
    info.innerHTML=`<b>📖 ${quiz[i].ref}</b><br><em>${quiz[i].verse}</em><hr><b>💡 Life Lesson:</b> ${quiz[i].life}`;
    next.textContent = (i === quiz.length - 1) ? "See your score." : "Next Question";
    next.style.display='inline-block';
    }
    function load(){
    tries=0;
    p.textContent=`Question ${i+1} of ${quiz.length}`;
    qel.textContent=quiz[i].q;ael.innerHTML='';info.style.display='none';info.innerHTML='';next.style.display='none';
    shuffle(quiz[i].answers);
    quiz[i].answers.forEach((ans, idx)=>{
    let b=document.createElement('button');b.className='opt';
    let letter=document.createElement('b');letter.textContent=letters[idx]+'. ';
    b.appendChild(letter);b.appendChild(document.createTextNode(ans.text));
    b.onclick=()=>{
    if(ans.correct){
    b.classList.add('correct');
    score++;
    reveal();
    } else {
    b.classList.add('wrong');
    b.disabled=true;
    tries++;
    if(tries===1){
    info.style.display='block';
    info.innerHTML='<b>Pass this question to the next person.</b><br>That option is out. The question is still open — someone else should choose from the remaining answers.';
    next.style.display='none';
    } else {
    reveal();
    }
    }
    };
    ael.appendChild(b);
    });
    }
    next.onclick=()=>{i++;if(i<quiz.length)load();else{
    document.querySelector('.q').style.display='none';ael.style.display='none';info.style.display='none';next.style.display='none';p.style.display='none';
    result.innerHTML=`<h2>🎉 You scored ${score} / ${quiz.length}</h2>
    <h3>Challenge for This Week</h3>
    <ul><li>Thank God for a gift in someone else that you do not have, and refuse the thought that you have no need of that person.</li><li>If you have been saying you are not of the body because your role is quiet, serve this week in the place God has set you.</li><li>When a member is suffering, share the burden in a concrete way rather than leaving it to the more visible gifts.</li><li>Use what you have been given for the profit of the whole church, not to be seen.</li><li>Desire what is best, and take one step on the more excellent way: a hidden act of love toward a member who is easy to overlook.</li></ul>
    <p><a class="home-btn" href="../index.html">WisdomHub</a></p>`;
    restart.style.display='inline-block';
    }};
    restart.onclick=()=>location.reload();
    load();
    </script></body></html>
