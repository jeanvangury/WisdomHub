<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Acts Ch 13</title>
    <style>
    body{font-family:Segoe UI,Arial;background:#eef3f8;margin:0;padding:24px}
    .card{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    h1{text-align:center;color:#234}
    #progress{font-weight:bold;color:#666}
    .q{font-size:1.35em;margin:18px 0}
    .opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #bbb;border-radius:8px;background:#fff;text-align:left;font-size:16px;cursor:pointer}
    .opt:hover{background:#eef6ff}.correct{background:#2eaf4a!important;color:#fff}.wrong{background:#d83b3b!important;color:#fff}
    #info{display:none;background:#eef8ff;border-left:5px solid #2d7ef7;padding:16px;margin-top:18px;border-radius:6px}
    #next,#restart{margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#2d7ef7;color:#fff;font-size:16px;cursor:pointer}
    #restart{background:#2eaf4a;display:none}
    .home-btn{display:inline-block;margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#1e3a5f;color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
    .home-btn:hover{opacity:.92}
    </style></head><body><div class="card">
    <h1>📖 Acts Ch 13</h1><div id="progress"></div><div id="question" class="q"></div><div id="answers"></div>
    <div id="info"></div><button id="next" style="display:none">Next Question</button><div id="result"></div><button id="restart">Play Again</button>
    </div>
    <script>
    let quiz=[
      {"q": "While the prophets and teachers in Antioch were worshiping and fasting, what did the Holy Spirit tell them to do?", "answers": [{"text": "Send Peter and John to Cyprus", "correct": false}, {"text": "Set apart Barnabas and Saul for the work to which He had called them", "correct": true}, {"text": "Appoint Manaen as the new church overseer", "correct": false}, {"text": "Move the entire church from Antioch to Jerusalem", "correct": false}], "ref": "Acts 13:2", "verse": "\u201cSet apart for me Barnabas and Saul for the work to which I have called them.\u201d", "life": "Mission starts with listening to the Spirit, not only with our own plans."},
      {"q": "Which leader in the Antioch church is described as having been brought up with Herod the tetrarch?", "answers": [{"text": "Lucius of Cyrene", "correct": false}, {"text": "Simeon called Niger", "correct": false}, {"text": "Manaen", "correct": true}, {"text": "John Mark", "correct": false}], "ref": "Acts 13:1", "verse": "\u201cManaen (who had been brought up with Herod the tetrarch) and Saul.\u201d", "life": "God calls people from every background\u2014even those close to worldly power\u2014into His service."},
      {"q": "After sailing from Seleucia to Cyprus, where did Barnabas and Saul first proclaim the word of God?", "answers": [{"text": "In the marketplace of Paphos", "correct": false}, {"text": "In the Jewish synagogues at Salamis", "correct": true}, {"text": "Only to Gentiles on the western coast", "correct": false}, {"text": "In Herod\u2019s palace in Jerusalem", "correct": false}], "ref": "Acts 13:4\u20135", "verse": "\u201cWhen they arrived at Salamis, they proclaimed the word of God in the Jewish synagogues.\u201d", "life": "Start where God opens a door, and share the word among those already seeking Him."},
      {"q": "When Elymas (Bar-Jesus) opposed them before Sergius Paulus, what judgment did Paul announce?", "answers": [{"text": "He would be struck dead at once", "correct": false}, {"text": "He would be exiled from Cyprus forever", "correct": false}, {"text": "He would be blind for a time and unable to see the light of the sun", "correct": true}, {"text": "He would lose his place as attendant to the proconsul", "correct": false}], "ref": "Acts 13:9\u201311", "verse": "\u201cYou are going to be blind for a time, not even able to see the light of the sun.\u201d", "life": "Opposing God\u2019s truth has real consequences; spiritual darkness is often the fruit of fighting the light."},
      {"q": "Why did the proconsul Sergius Paulus believe?", "answers": [{"text": "Because Barnabas healed his servant", "correct": false}, {"text": "Because he was amazed at the teaching about the Lord after seeing what happened", "correct": true}, {"text": "Because Elymas converted and baptized him", "correct": false}, {"text": "Because an angel appeared to him in a dream", "correct": false}], "ref": "Acts 13:12", "verse": "\u201cWhen the proconsul saw what had happened, he believed, for he was amazed at the teaching about the Lord.\u201d", "life": "Power and clear teaching about the Lord can open even influential hearts to faith."},
      {"q": "At Perga in Pamphylia, what did John Mark do?", "answers": [{"text": "He was baptized by Paul", "correct": false}, {"text": "He left them to return to Jerusalem", "correct": true}, {"text": "He stayed behind to plant a church alone", "correct": false}, {"text": "He confronted another sorcerer named Simon", "correct": false}], "ref": "Acts 13:13", "verse": "\u201cFrom Paphos, Paul and his companions sailed to Perga in Pamphylia, where John left them to return to Jerusalem.\u201d", "life": "Not everyone finishes every mission the same way; faithfulness and later reconciliation both matter."},
      {"q": "In Paul\u2019s synagogue sermon, what does God testify about David son of Jesse?", "answers": [{"text": "He never sinned and needed no forgiveness", "correct": false}, {"text": "He was a man after God\u2019s own heart who would do everything God wanted", "correct": true}, {"text": "He would rule forever without dying", "correct": false}, {"text": "He was greater than all the prophets combined", "correct": false}], "ref": "Acts 13:22", "verse": "\u201cI have found David son of Jesse, a man after my own heart; he will do everything I want him to do.\u201d", "life": "God values a heart that seeks Him and aims to do His will\u2014not flawless performance."},
      {"q": "According to Paul, what can everyone who believes receive through Jesus that the law of Moses could not provide?", "answers": [{"text": "Political freedom from Rome", "correct": false}, {"text": "Justification\u2014being set free from every sin", "correct": true}, {"text": "Guaranteed wealth and long life", "correct": false}, {"text": "A seat among the synagogue rulers", "correct": false}], "ref": "Acts 13:38\u201339", "verse": "\u201cThrough him everyone who believes is set free from every sin, a justification you were not able to obtain under the law of Moses.\u201d", "life": "Forgiveness and true freedom come through faith in Jesus, not by keeping rules alone."},
      {"q": "When many Jews rejected the message, which Scripture did Paul and Barnabas cite as they turned to the Gentiles?", "answers": [{"text": "\u201cThe Lord is my shepherd; I lack nothing.\u201d", "correct": false}, {"text": "\u201cI have made you a light for the Gentiles, that you may bring salvation to the ends of the earth.\u201d", "correct": true}, {"text": "\u201cBlessed are the meek, for they will inherit the earth.\u201d", "correct": false}, {"text": "\u201cYou must be born again.\u201d", "correct": false}], "ref": "Acts 13:46\u201347", "verse": "\u201cI have made you a light for the Gentiles, that you may bring salvation to the ends of the earth.\u201d", "life": "When one door closes, God\u2019s mission still goes forward\u2014often to people you did not expect."},
      {"q": "After Paul and Barnabas were expelled from the region, what did they do, and how were the disciples left?", "answers": [{"text": "They sued the city leaders; the disciples were afraid", "correct": false}, {"text": "They shook the dust off their feet as a warning and went to Iconium; the disciples were filled with joy and the Holy Spirit", "correct": true}, {"text": "They returned immediately to Antioch; the disciples quit gathering", "correct": false}, {"text": "They stayed in hiding for forty days; the disciples scattered", "correct": false}], "ref": "Acts 13:50\u201352", "verse": "\u201cSo they shook the dust off their feet as a warning to them and went to Iconium. And the disciples were filled with joy and with the Holy Spirit.\u201d", "life": "Rejection does not cancel joy; the Spirit can fill God\u2019s people even when the mission gets hard."}
    ];
    function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
    shuffle(quiz);quiz.forEach(q=>shuffle(q.answers));
    let i=0,score=0;
    const p=progress,qel=question,ael=answers,info=document.getElementById('info');
    function load(){
    p.textContent=`Question ${i+1} of ${quiz.length}`;
    qel.textContent=quiz[i].q;ael.innerHTML='';info.style.display='none';info.innerHTML='';next.style.display='none';
    quiz[i].answers.forEach(ans=>{
    let b=document.createElement('button');b.className='opt';b.textContent=ans.text;
    b.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    if(ans.correct){b.classList.add('correct');score++;}else{b.classList.add('wrong');document.querySelectorAll('.opt').forEach((x,k)=>{if(quiz[i].answers[k].correct)x.classList.add('correct');});}
    info.style.display='block';
    info.innerHTML=`<b>📖 ${quiz[i].ref}</b><br><em>${quiz[i].verse}</em><hr><b>💡 Life Lesson:</b> ${quiz[i].life}`;
    next.textContent = (i === quiz.length - 1) ? "See your score." : "Next Question";
    next.style.display='inline-block';
    };
    ael.appendChild(b);
    });
    }
    next.onclick=()=>{i++;if(i<quiz.length)load();else{
    document.querySelector('.q').style.display='none';ael.style.display='none';info.style.display='none';next.style.display='none';p.style.display='none';
    result.innerHTML=`<h2>🎉 You scored ${score} / ${quiz.length}</h2>
    <h3>Challenge for This Week</h3>
    <ul><li>Ask the Holy Spirit to show you the work He has set apart for you.</li><li>Share the gospel even when someone tries to shut the door.</li><li>Remember that justification comes through Jesus, not performance.</li><li>When rejected, keep going\u2014and choose joy in the Spirit.</li><li>Pick one lesson from Acts 13 and live it this week.</li></ul>
    <p><a class="home-btn" href="../index.html">WisdomHub</a></p>`;
    restart.style.display='inline-block';
    }};
    restart.onclick=()=>location.reload();
    load();
    </script></body></html>
