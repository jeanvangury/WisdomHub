
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acts 1–10 Teen Bible Quiz</title>
<style>
body{font-family:Segoe UI,Arial;background:#eef3f8;margin:0;padding:24px}
.card{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
h1{text-align:center;color:#234}
#progress{font-weight:bold;color:#666}
.q{font-size:1.35em;margin:18px 0}
.opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #bbb;border-radius:8px;background:#fff;text-align:left;font-size:16px;cursor:pointer}
.opt:hover{background:#eef6ff}.correct{background:#2eaf4a!important;color:#fff}.wrong{background:#d83b3b!important;color:#fff}
#info{display:none;background:#eef8ff;border-left:5px solid #2d7ef7;padding:16px;margin-top:18px;border-radius:6px}
#next,#restart{margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#2d7ef7;color:#fff;font-size:16px;cursor:pointer}
#restart{background:#2eaf4a;display:none}
</style></head><body><div class="card">
<h1>📖 Acts 1–10 Teen Bible Quiz</h1><div id="progress"></div><div id="question" class="q"></div><div id="answers"></div>
<div id="info"></div><button id="next" style="display:none">Next Question</button><div id="result"></div><button id="restart">Play Again</button>
</div>
<script>
let quiz=[{"q": "Before Jesus ascended into heaven, what did He tell His disciples to do?", "answers": [{"text": "Return to Galilee", "correct": false}, {"text": "Build churches", "correct": false}, {"text": "Wait in Jerusalem for the Holy Spirit", "correct": true}, {"text": "Choose new apostles", "correct": false}], "ref": "Acts 1:4\u20135", "verse": "\u201cDo not leave Jerusalem, but wait for the gift My Father promised...\u201d", "life": "God often asks us to wait before He asks us to go."}, {"q": "Why did the disciples choose Matthias?", "answers": [{"text": "Because he was Peter's brother", "correct": false}, {"text": "Because he was the best speaker", "correct": false}, {"text": "Because he had seen Jesus after the resurrection", "correct": false}, {"text": "Because he had faithfully followed Jesus from the beginning", "correct": true}], "ref": "Acts 1:21\u201326", "verse": "\u201c...the lot fell to Matthias...\u201d", "life": "Faithfulness in small things prepares us for greater responsibility."}, {"q": "When the Holy Spirit came on Pentecost, what amazed the crowd?", "answers": [{"text": "Fire fell from heaven", "correct": false}, {"text": "The apostles became invisible", "correct": false}, {"text": "Everyone heard God's message in their own language", "correct": true}, {"text": "The Temple shook", "correct": false}], "ref": "Acts 2:6\u20138", "verse": "\u201cEach one heard them speaking in his own language.\u201d", "life": "God wants everyone to hear the good news."}, {"q": "Peter said Pentecost fulfilled whose prophecy?", "answers": [{"text": "Isaiah", "correct": false}, {"text": "Moses", "correct": false}, {"text": "David", "correct": false}, {"text": "Joel", "correct": true}], "ref": "Acts 2:16\u201318", "verse": "\u201cThis is what was spoken by the prophet Joel...\u201d", "life": "God always keeps His promises."}, {"q": "After Peter preached, what question did the crowd ask?", "answers": [{"text": "Can we perform miracles?", "correct": false}, {"text": "Who is greatest?", "correct": false}, {"text": "What shall we do?", "correct": true}, {"text": "Where is Jesus?", "correct": false}], "ref": "Acts 2:37", "verse": "\u201cBrothers, what shall we do?\u201d", "life": "A changed heart wants to obey God."}, {"q": "Peter replied they should...", "answers": [{"text": "Keep all Jewish laws", "correct": false}, {"text": "Offer sacrifices", "correct": false}, {"text": "Repent, be baptized and receive the Holy Spirit", "correct": true}, {"text": "Return home", "correct": false}], "ref": "Acts 2:38", "verse": "\u201cRepent... and you will receive the gift of the Holy Spirit.\u201d", "life": "Repentance is the beginning of a new life."}, {"q": "When Peter healed the lame man, who received the glory?", "answers": [{"text": "Peter", "correct": false}, {"text": "John", "correct": false}, {"text": "The man", "correct": false}, {"text": "Jesus", "correct": true}], "ref": "Acts 3:12\u201316", "verse": "\u201cWhy do you stare at us as though by our own power...?\u201d", "life": "Always point people to Jesus, not yourself."}, {"q": "Peter and John boldly said...", "answers": [{"text": "We will obey the council", "correct": false}, {"text": "We will stop preaching", "correct": false}, {"text": "We cannot help speaking about what we have seen and heard", "correct": true}, {"text": "We will leave Jerusalem", "correct": false}], "ref": "Acts 4:20", "verse": "\u201cWe cannot help speaking...\u201d", "life": "Boldness comes from knowing Jesus."}, {"q": "After believers prayed for boldness...", "answers": [{"text": "They left Jerusalem", "correct": false}, {"text": "Fire came down", "correct": false}, {"text": "The place was shaken and they spoke boldly", "correct": true}, {"text": "They became invisible", "correct": false}], "ref": "Acts 4:31", "verse": "\u201cThe place...was shaken...\u201d", "life": "Prayer changes us before it changes circumstances."}, {"q": "What was Ananias and Sapphira's real sin?", "answers": [{"text": "Being poor", "correct": false}, {"text": "Giving too little", "correct": false}, {"text": "Lying to the Holy Spirit", "correct": true}, {"text": "Missing church", "correct": false}], "ref": "Acts 5:3\u20134", "verse": "\u201cYou have lied to the Holy Spirit.\u201d", "life": "God values honesty more than appearances."}, {"q": "Gamaliel advised the council to...", "answers": [{"text": "Stone the apostles", "correct": false}, {"text": "Imprison them forever", "correct": false}, {"text": "Leave them alone because God's work cannot be stopped", "correct": true}, {"text": "Send them away", "correct": false}], "ref": "Acts 5:38\u201339", "verse": "\u201cIf it is from God, you will not be able to stop these men.\u201d", "life": "Nothing can stop God's plans."}, {"q": "What made Stephen stand out?", "answers": [{"text": "He was wealthy", "correct": false}, {"text": "He was older", "correct": false}, {"text": "He was full of faith and the Holy Spirit", "correct": true}, {"text": "He studied abroad", "correct": false}], "ref": "Acts 6:5,8", "verse": "\u201cStephen, a man full of faith and of the Holy Spirit...\u201d", "life": "God uses people whose hearts belong to Him."}, {"q": "While Stephen was dying, what did he pray?", "answers": [{"text": "Destroy my enemies", "correct": false}, {"text": "Send angels", "correct": false}, {"text": "Lord, do not hold this sin against them", "correct": true}, {"text": "Take revenge", "correct": false}], "ref": "Acts 7:60", "verse": "\u201cLord, do not hold this sin against them.\u201d", "life": "Forgiveness reflects the heart of Jesus."}, {"q": "Philip explained Isaiah's prophecy to...", "answers": [{"text": "Cornelius", "correct": false}, {"text": "Saul", "correct": false}, {"text": "Simon", "correct": false}, {"text": "The Ethiopian official", "correct": true}], "ref": "Acts 8:35", "verse": "\u201cPhilip began with that very passage...\u201d", "life": "Every conversation can become an opportunity to share Jesus."}, {"q": "Why was Simon the sorcerer rebuked?", "answers": [{"text": "He hated Christians", "correct": false}, {"text": "He refused baptism", "correct": false}, {"text": "He wanted God's power for the wrong reason", "correct": true}, {"text": "He left Samaria", "correct": false}], "ref": "Acts 8:20\u201323", "verse": "\u201cMay your money perish with you...\u201d", "life": "God's gifts cannot be bought or earned."}, {"q": "What did Jesus ask Saul?", "answers": [{"text": "Do you believe in Me?", "correct": false}, {"text": "Why are you afraid?", "correct": false}, {"text": "Why are you persecuting Me?", "correct": true}, {"text": "Will you follow Me?", "correct": false}], "ref": "Acts 9:4", "verse": "\u201cSaul, Saul, why do you persecute Me?\u201d", "life": "Jesus knows everything we do."}, {"q": "What did Ananias do when he met Saul?", "answers": [{"text": "Ran away", "correct": false}, {"text": "Argued", "correct": false}, {"text": "Prayed for him and called him Brother Saul", "correct": true}, {"text": "Sent him away", "correct": false}], "ref": "Acts 9:17", "verse": "\u201cBrother Saul...\u201d", "life": "God can completely transform a person's life."}, {"q": "Why did many people in Joppa believe?", "answers": [{"text": "Peter preached daily", "correct": false}, {"text": "Cornelius visited", "correct": false}, {"text": "Tabitha was raised from the dead", "correct": true}, {"text": "They saw an angel", "correct": false}], "ref": "Acts 9:42", "verse": "\u201cMany believed in the Lord.\u201d", "life": "Miracles should lead people to Jesus."}, {"q": "What surprised the Jewish believers at Cornelius' house?", "answers": [{"text": "Cornelius became an apostle", "correct": false}, {"text": "Peter spoke Greek", "correct": false}, {"text": "The Holy Spirit came upon the Gentiles", "correct": true}, {"text": "An angel returned", "correct": false}], "ref": "Acts 10:44\u201348", "verse": "\u201cThe gift of the Holy Spirit had been poured out even on the Gentiles.\u201d", "life": "The gospel is for everyone."}, {"q": "Before ascending, Jesus told His disciples they would receive power when the Holy Spirit came. Where did He say they would be His witnesses?", "answers": [{"text": "Only in Jerusalem", "correct": false}, {"text": "Jerusalem, in all Judea and Samaria, and to the ends of the earth", "correct": true}, {"text": "Only to the people of Israel", "correct": false}, {"text": "Only in the Temple in Jerusalem", "correct": false}], "ref": "Acts 1:8", "verse": "\u201cBut you will receive power when the Holy Spirit comes on you; and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth.\u201d", "life": "God calls us to be His witnesses wherever He sends us, even beyond our familiar surroundings and comfort zone."}];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
shuffle(quiz);quiz.forEach(q=>shuffle(q.answers));
let i=0,score=0;
const p=progress,qel=question,ael=answers,info=document.getElementById('info');
function load(){
p.textContent=`Question ${i+1} of ${quiz.length}`;
qel.textContent=quiz[i].q;ael.innerHTML='';info.style.display='none';info.innerHTML='';next.style.display='none';
quiz[i].answers.forEach(ans=>{
let b=document.createElement('button');b.className='opt';b.textContent=ans.text;
b.onclick=()=>{
document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
if(ans.correct){b.classList.add('correct');score++;}else{b.classList.add('wrong');document.querySelectorAll('.opt').forEach((x,k)=>{if(quiz[i].answers[k].correct)x.classList.add('correct');});}
info.style.display='block';
info.innerHTML=`<b>📖 ${quiz[i].ref}</b><br><em>${quiz[i].verse}</em><hr><b>💡 Life Lesson:</b> ${quiz[i].life}`;
next.style.display='inline-block';
};
ael.appendChild(b);
});
}
next.onclick=()=>{i++;if(i<quiz.length)load();else{
document.querySelector('.q').style.display='none';ael.style.display='none';info.style.display='none';next.style.display='none';p.style.display='none';
result.innerHTML=`<h2>🎉 You scored ${score} / ${quiz.length}</h2>
<h3>Challenge for This Week</h3>
<ul><li>Spend time with Jesus every day.</li><li>Ask the Holy Spirit to make you bold.</li><li>Look for one opportunity to share your faith.</li><li>Choose one lesson from Acts 1–10 and live it out this week.</li></ul>`;
restart.style.display='inline-block';
}};
restart.onclick=()=>location.reload();
load();
</script></body></html>
