<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acts 1–10 Bible Quiz (Advanced)</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:30px;
}

.container{
    max-width:850px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#2c3e50;
}

#progress{
    margin-top:15px;
    color:#666;
    font-weight:bold;
}

.question{
    margin-top:25px;
    font-size:22px;
    font-weight:bold;
}

.option{
    display:block;
    width:100%;
    margin:12px 0;
    padding:14px;
    font-size:17px;
    border:2px solid #bbb;
    border-radius:8px;
    background:white;
    cursor:pointer;
    text-align:left;
}

.option:hover{
    background:#eef5ff;
}

.correct{
    background:#28a745 !important;
    color:white;
    border-color:#28a745;
}

.wrong{
    background:#dc3545 !important;
    color:white;
    border-color:#dc3545;
}

button{
    margin-top:25px;
    padding:12px 24px;
    font-size:17px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

#nextBtn{
    background:#007bff;
    color:white;
}

#restartBtn{
    background:#28a745;
    color:white;
}

#score{
    text-align:center;
    font-size:28px;
    margin-top:30px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Acts 1–10 Bible Quiz</h1>

<div id="progress"></div>

<div id="quiz">

<div id="question" class="question"></div>

<div id="answers"></div>

<button id="nextBtn" onclick="nextQuestion()" style="display:none;">
Next Question
</button>

</div>

<div id="score"></div>

<button id="restartBtn"
onclick="restartQuiz()"
style="display:none;">
Restart Quiz
</button>

</div>

<script>

const quiz=[

{
q:"Before choosing Matthias, Peter quoted which two Psalms concerning Judas?",
a:[
["Psalm 22 and Psalm 23",false],
["Psalm 91 and Psalm 110",false],
["Psalm 69 and Psalm 109",true],
["Psalm 2 and Psalm 8",false]
]
},

{
q:"According to Peter's sermon at Pentecost, David foresaw whose resurrection?",
a:[
["Moses",false],
["Elijah",false],
["Christ",true],
["John",false]
]
},

{
q:"Why were Jews from many nations able to understand the apostles on Pentecost?",
a:[
["Everyone understood Hebrew",false],
["The apostles used translators",false],
["Each heard them in his own language",true],
["Peter interpreted for everyone",false]
]
},

{
q:"Which prophet did Peter quote to explain Pentecost?",
a:[
["Isaiah",false],
["Ezekiel",false],
["Joel",true],
["Zechariah",false]
]
},

{
q:"Which was NOT one of the four activities of the early church in Acts 2:42?",
a:[
["The apostles' teaching",false],
["Fellowship",false],
["Breaking of bread",false],
["Evangelistic crusades",true]
]
},

{
q:"At what hour did Peter and John go to the Temple to pray?",
a:[
["Sixth hour",false],
["Third hour",false],
["Ninth hour",true],
["Twelfth hour",false]
]
},

{
q:"What was the name of the gate where the lame man sat?",
a:[
["Eastern Gate",false],
["Golden Gate",false],
["Beautiful Gate",true],
["Sheep Gate",false]
]
},

{
q:"Peter explained that the lame man was healed through:",
a:[
["Peter's faith",false],
["The man's faith alone",false],
["Faith in the name of Jesus",true],
["Prayer of the apostles",false]
]
},

{
q:"Which two failed movements did Gamaliel mention?",
a:[
["Barabbas and Judas Iscariot",false],
["Theudas and Judas the Galilean",true],
["Simon and Elymas",false],
["Herod and Pilate",false]
]
},

{
q:"Why did the apostles rejoice after being flogged?",
a:[
["They escaped prison",false],
["The church grew",false],
["They were counted worthy to suffer for Jesus",true],
["They received gifts",false]
]
},

{
q:"Stephen was accused of speaking against:",
a:[
["Rome and Caesar",false],
["Moses and the Temple",true],
["Peter and John",false],
["The Prophets",false]
]
},

{
q:"Who refused to be called the son of Pharaoh's daughter?",
a:[
["Joseph",false],
["Moses",true],
["Samuel",false],
["Joshua",false]
]
},

{
q:"Before dying, Stephen saw:",
a:[
["Twelve angels",false],
["Moses and Elijah",false],
["Jesus standing at God's right hand",true],
["The New Jerusalem",false]
]
},

{
q:"Why was Simon the sorcerer rebuked?",
a:[
["Practicing magic",false],
["Refusing baptism",false],
["Trying to buy God's gift",true],
["Opposing Philip",false]
]
},

{
q:"Philip asked the Ethiopian official:",
a:[
["Do you believe in God?",false],
["Where are you travelling?",false],
["Do you understand what you are reading?",true],
["Have you been baptized?",false]
]
},

{
q:"What happened after the Ethiopian eunuch was baptized?",
a:[
["Philip returned with him",false],
["His servants were baptized",false],
["The Spirit caught Philip away",true],
["An angel appeared",false]
]
},

{
q:"How did Ananias first address Saul?",
a:[
["Rabbi Saul",false],
["Apostle Saul",false],
["Brother Saul",true],
["Son of Abraham",false]
]
},

{
q:"What was Saul doing during the three days after meeting Jesus?",
a:[
["Preaching",false],
["Travelling",false],
["Fasting and praying",true],
["Studying",false]
]
},

{
q:"What was the result of Peter raising Tabitha?",
a:[
["Herod believed",false],
["A church was built",false],
["Many believed in the Lord",true],
["Peter became High Priest",false]
]
},

{
q:"Why did Peter hesitate to visit Cornelius?",
a:[
["He was wealthy",false],
["He was a Roman soldier",false],
["Jewish custom discouraged association with Gentiles",true],
["Peter feared arrest",false]
]
},

{
q:"Which statement was repeated three times in Peter's vision?",
a:[
["Do not fear",false],
["Repent and believe",false],
["What God has cleansed you must not call common",true],
["Follow Me",false]
]
},

{
q:"Who recognized that Gentiles had received the Holy Spirit before baptism?",
a:[
["James",false],
["Barnabas",false],
["Peter and the Jewish believers",true],
["Philip",false]
]
},

{
q:"According to Acts 10:38, Jesus went about:",
a:[
["Teaching only in synagogues",false],
["Healing only Israelites",false],
["Doing good and healing all oppressed by the devil",true],
["Building the Temple",false]
]
}

];

let current=0;
let score=0;

function loadQuestion(){

document.getElementById("progress").innerHTML=
"Question "+(current+1)+" of "+quiz.length;

document.getElementById("nextBtn").style.display="none";

let q=quiz[current];

document.getElementById("question").innerHTML=q.q;

let answers=document.getElementById("answers");

answers.innerHTML="";

q.a.forEach(item=>{

let btn=document.createElement("button");

btn.className="option";

btn.innerHTML=item[0];

btn.onclick=function(){

Array.from(document.getElementsByClassName("option"))
.forEach(b=>b.disabled=true);

if(item[1]){
btn.classList.add("correct");
score++;
}else{
btn.classList.add("wrong");

Array.from(document.getElementsByClassName("option"))
.forEach((b,i)=>{
if(q.a[i][1]){
b.classList.add("correct");
}
});
}

document.getElementById("nextBtn").style.display="inline-block";

};

answers.appendChild(btn);

});

}

function nextQuestion(){

current++;

if(current<quiz.length){
loadQuestion();
}
else{

document.getElementById("quiz").style.display="none";

document.getElementById("score").innerHTML=
"🎉 You scored <br><br><span style='font-size:48px;color:#28a745;'>"
+score+" / "+quiz.length+
"</span>";

document.getElementById("restartBtn").style.display="inline-block";

}

}

function restartQuiz(){

current=0;
score=0;

document.getElementById("quiz").style.display="block";

document.getElementById("score").innerHTML="";

document.getElementById("restartBtn").style.display="none";

loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
