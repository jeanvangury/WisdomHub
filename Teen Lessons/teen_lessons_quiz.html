<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Teen Lessons Quiz</title>
    <style>
    body{font-family:Segoe UI,Arial;background:#eef3f8;margin:0;padding:24px}
    .card{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    h1{text-align:center;color:#234}
    .sub{text-align:center;color:#666;font-size:0.95rem;margin:-6px 0 12px}
    #progress{font-weight:bold;color:#666}
    .lesson-label{display:none;margin:8px 0 4px;padding:8px 12px;background:#fde8e8;border-left:4px solid #d96b6b;border-radius:6px;color:#a33a3a;font-size:0.95rem;font-weight:600}
    .q{font-size:1.25em;margin:18px 0;line-height:1.4}
    .opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #bbb;border-radius:8px;background:#fff;text-align:left;font-size:16px;cursor:pointer}
    .opt:hover{background:#eef6ff}.correct{background:#2eaf4a!important;color:#fff}.wrong{background:#d83b3b!important;color:#fff}
    #info{display:none;background:#eef8ff;border-left:5px solid #2d7ef7;padding:16px;margin-top:18px;border-radius:6px}
    #next,#restart{margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#2d7ef7;color:#fff;font-size:16px;cursor:pointer}
    #restart{background:#2eaf4a;display:none}
    .home-btn{display:inline-block;margin-top:18px;padding:12px 22px;border:none;border-radius:8px;background:#1e3a5f;color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
    .home-btn:hover{opacity:.92}
    </style></head><body><div class="card">
    <h1>📖 Teen Lessons Quiz</h1>
    <p class="sub">30 questions from our teen lessons on God’s design, Jonah, peace in storms, rising after failure, and wise decisions</p>
    <div id="progress"></div><div id="question" class="q"></div><div id="lesson" class="lesson-label"></div><div id="answers"></div>
    <div id="info"></div><button id="next" style="display:none">Next Question</button><div id="result"></div><button id="restart">Play Again</button>
    </div>
    <script>
    let quiz=[
      {"lesson": "Discovering God's Design for You", "q": "In Discovering God’s Design, the lesson says God knew us before we existed. What does that mean for how He made us?", "answers": [{"text": "He only planned the day we would be born", "correct": false}, {"text": "He saw us yet unformed and fashioned our days with intention—even our uniqueness", "correct": true}, {"text": "He decided we would never face tough or ordinary days", "correct": false}, {"text": "He left our purpose completely up to chance", "correct": false}], "ref": "Psalm 139:16 — Discovering God’s Design", "verse": "“Your eyes saw my substance, being yet unformed. And in Your book they all were written, the days fashioned for me…”", "life": "God knew you before you existed. Your life isn’t random—He designed it with intention."},
      {"lesson": "Discovering God's Design for You", "q": "According to the lesson, why did God create us as His handiwork in Christ Jesus?", "answers": [{"text": "To impress others with our gifts", "correct": false}, {"text": "To do good works He prepared in advance for us to walk in", "correct": true}, {"text": "So we would never face hardship", "correct": false}, {"text": "Only to keep religious rules with no purpose", "correct": false}], "ref": "Ephesians 2:10 — Discovering God’s Design", "verse": "“For we are God’s handiwork, created in Christ Jesus to do good works, which God prepared in advance for us to do.”", "life": "Your purpose isn’t something you invent alone—God already prepared good works for you to walk in."},
      {"lesson": "Discovering God's Design for You", "q": "In the Weaver illustration, what do we see compared with what God sees?", "answers": [{"text": "We see the finished masterpiece; God sees only today’s thread", "correct": false}, {"text": "We only see today’s thread; God sees the finished masterpiece", "correct": true}, {"text": "Neither we nor God can see the design yet", "correct": false}, {"text": "We see the whole saree; God only sees the loom", "correct": false}], "ref": "Discovering God’s Design", "verse": "A Banaras weaver’s pattern looks messy halfway through—but once complete, a beautiful design is revealed.", "life": "When life feels messy, trust the Designer. He sees the full picture you can’t see yet."},
      {"lesson": "Discovering God's Design for You", "q": "According to the lesson, God’s design for us includes knowing Jesus and being what?", "answers": [{"text": "Popular at all costs", "correct": false}, {"text": "Set apart—salt and light in the world", "correct": true}, {"text": "Exactly like everyone else so we fit in", "correct": false}, {"text": "Hidden so no one notices our faith", "correct": false}], "ref": "Jeremiah 1:5; Matthew 5:13 — Discovering God’s Design", "verse": "“Before I formed you in the womb I knew you… I set you apart…” / “You are the salt of the earth.”", "life": "Trying to squeeze into someone else’s “size” never fits. God set you apart for His purpose."},
      {"lesson": "Discovering God's Design for You", "q": "The lesson asks whether it’s right to plan. What does it warn us against when we make plans?", "answers": [{"text": "Making any plans at all", "correct": false}, {"text": "Self-dependent pride and boasting—as if tomorrow is ours without God", "correct": true}, {"text": "Asking the Holy Spirit for help", "correct": false}, {"text": "Planning anything related to school or future", "correct": false}], "ref": "James 4:13–17 — Discovering God’s Design", "verse": "“Instead you ought to say, ‘If the Lord wills, we shall live and do this or that.’”", "life": "Planning is wise when your desire is God’s will—not when you’re boasting in yourself."},
      {"lesson": "Discovering God's Design for You", "q": "According to the lesson, after we plan to the best of our ability, what should we depend on?", "answers": [{"text": "Our friends’ opinions only", "correct": false}, {"text": "The Lord to enable us and direct our steps", "correct": true}, {"text": "Luck and perfect timing", "correct": false}, {"text": "Comparing ourselves with others’ plans", "correct": false}], "ref": "Proverbs 16:9 — Discovering God’s Design", "verse": "“A man’s heart plans his way, but the LORD directs his steps.”", "life": "Make your plans—and then trust God to steer your steps."},

      {"lesson": "Jonah / Finding God's Heart", "q": "In the Jonah lesson, what difficult assignment did God give Jonah?", "answers": [{"text": "Sail to Tarshish and start a new life", "correct": false}, {"text": "Go to Nineveh, an enemy city, and preach against its wickedness", "correct": true}, {"text": "Stay in Joppa and wait for another prophet", "correct": false}, {"text": "Preach only to people who already loved Israel", "correct": false}], "ref": "Jonah 1:1–2 — Finding God’s Heart / Jonah", "verse": "“Go to the great city of Nineveh and preach against it, because its wickedness has come up before me.”", "life": "God’s call can be hard—but His heart is for people we might want to write off."},
      {"lesson": "Jonah / Finding God's Heart", "q": "According to the lesson, why did Jonah run instead of obeying?", "answers": [{"text": "He didn’t understand God’s instructions", "correct": false}, {"text": "He didn’t want God to show mercy to a city he felt was undeserving", "correct": true}, {"text": "He was mainly afraid of drowning at sea", "correct": false}, {"text": "He thought God had called the wrong prophet", "correct": false}], "ref": "Jonah 1:3 — Finding God’s Heart / Jonah", "verse": "Jonah didn’t misunderstand God. He just didn’t want to obey.", "life": "Sometimes we don’t run because we’re confused—we run because we don’t like what God asks."},
      {"lesson": "Jonah / Finding God's Heart", "q": "The lesson says Jonah’s flight was a calculated spiritual retreat. Roughly how far in the wrong direction did he go?", "answers": [{"text": "A short walk to the next village", "correct": false}, {"text": "About 2,500 miles west toward Tarshish, while Nineveh was east", "correct": true}, {"text": "Straight south into Egypt", "correct": false}, {"text": "North into Greece to hide among philosophers", "correct": false}], "ref": "Jonah 1:3 — Finding God’s Heart", "verse": "Nineveh was east. Jonah went to Joppa, paid a fare, and sailed west for Tarshish—about 2,500 miles in the wrong direction.", "life": "Running from God is often expensive, intentional, and still the wrong way."},
      {"lesson": "Jonah / Finding God's Heart", "q": "In the storm of redirection, how did Jonah respond when the sailors confronted him?", "answers": [{"text": "He turned the ship around toward Nineveh at once", "correct": false}, {"text": "He stubbornly told them to throw him into the sea rather than repent", "correct": true}, {"text": "He led them in worship until the storm stopped", "correct": false}, {"text": "He pretended he didn’t know about God", "correct": false}], "ref": "Jonah 1 — The Storm of Redirection", "verse": "Even when confronted, Jonah stubbornly told them to throw him into the sea rather than repent.", "life": "Stubbornness can deepen a storm. God still redirects—but repentance is the better path."},
      {"lesson": "Jonah / Finding God's Heart", "q": "What key insight does the lesson give about storms like Jonah’s?", "answers": [{"text": "Every storm is only punishment for past failure", "correct": false}, {"text": "Sometimes storms are God forcefully redirecting us back to our purpose", "correct": true}, {"text": "Storms prove God has abandoned us", "correct": false}, {"text": "Storms only happen to unbelievers", "correct": false}], "ref": "Jonah — Finding God’s Heart", "verse": "Even in this wrong turn, the sailors saw the storm cease and believed in God.", "life": "Hardship can become testimony. God can use even our wrong turns for His glory."},
      {"lesson": "Jonah / Finding God's Heart", "q": "According to the lesson, how was the great fish part of God’s mercy toward Jonah?", "answers": [{"text": "It was only a punishment with no hope", "correct": false}, {"text": "It protected Jonah from dying and gave him space to pray and repent", "correct": true}, {"text": "It took him straight to Tarshish safely", "correct": false}, {"text": "It proved God had finished with him forever", "correct": false}], "ref": "Jonah 1–2 — God of Second Chances", "verse": "God sent a fish to protect Jonah from dying. In the belly of the fish Jonah prayed and praised God.", "life": "What feels like a dead end may actually be God’s protection and a second chance."},
      {"lesson": "Jonah / Finding God's Heart", "q": "After Jonah finally obeyed, what does the lesson emphasize about his short message in Nineveh?", "answers": [{"text": "The city ignored him because the sermon was too short", "correct": false}, {"text": "Showing up and speaking God’s words led the whole city—even the king—to repent", "correct": true}, {"text": "Only a few sailors believed, and nothing else changed", "correct": false}, {"text": "Success depended on Jonah’s speaking skill and long preparation", "correct": false}], "ref": "Jonah 3 — Your Mission Is Yours", "verse": "Jonah preached a very small sermon, but those few words went up to the king, and they all repented.", "life": "It’s not about your skill—it’s about showing up and speaking what God gives you."},
      {"lesson": "Jonah / Finding God's Heart", "q": "According to the Jonah lesson, what should we remember when life feels like a wrong turn or a storm?", "answers": [{"text": "God only works through perfect people", "correct": false}, {"text": "In all things God can work for the good of those who love Him and are called to His purpose", "correct": true}, {"text": "Running away is always the safest option", "correct": false}, {"text": "Our hardships never become a testimony to others", "correct": false}], "ref": "Romans 8:28 — Jonah lesson", "verse": "“And we know that in all things God works for the good of those who love him, who have been called according to his purpose.”", "life": "God can work even our messes for good when we love Him and walk in His calling."},

      {"lesson": "Peace, Be Still", "q": "In Peace, Be Still, the boat is filling with water and Jesus is asleep. How do the disciples react?", "answers": [{"text": "They quietly pray with full confidence", "correct": false}, {"text": "They panic and ask if He even cares that they are perishing", "correct": true}, {"text": "They sing worship songs until the wind stops", "correct": false}, {"text": "They jump overboard to save themselves", "correct": false}], "ref": "Mark 4:37–40 — Peace, Be Still", "verse": "“Teacher, do You not care that we are perishing?”", "life": "Fear looks at the storm. Faith looks at Jesus—even when He seems silent."},
      {"lesson": "Peace, Be Still", "q": "When Jesus woke up in the storm, what did He do first that showed His authority?", "answers": [{"text": "He told the disciples to build a better boat", "correct": false}, {"text": "He rebuked the wind and said, “Peace. Be still,” and the storm obeyed", "correct": true}, {"text": "He asked the disciples to vote on what to do", "correct": false}, {"text": "He swam ahead to find safer water", "correct": false}], "ref": "Mark 4:39 — Peace, Be Still", "verse": "Jesus stood up and spoke three words: “Peace. Be still.” And immediately the storm obeyed Him.", "life": "Jesus has authority over every storm—natural or supernatural."},
      {"lesson": "Peace, Be Still", "q": "According to the lesson, what is real peace?", "answers": [{"text": "The absence of all problems", "correct": false}, {"text": "A heart that keeps trusting God despite hurt or uncertainty around us", "correct": true}, {"text": "Never feeling afraid again", "correct": false}, {"text": "Getting everything you want right away", "correct": false}], "ref": "Peace, Be Still", "verse": "Peace isn’t the absence of problems. It’s choosing faith over fear.", "life": "The storm around you doesn’t have to rob the peace of God in you."},
      {"lesson": "Peace, Be Still", "q": "The lesson points out Jesus already knew the storm was coming when He said to cross over. Why does that matter?", "answers": [{"text": "It shows He makes mistakes like we do", "correct": false}, {"text": "It shows He isn’t shocked by our storms—and He is still with us in them", "correct": true}, {"text": "It proves storms surprise God too", "correct": false}, {"text": "It means He wanted the disciples to fail on purpose", "correct": false}], "ref": "Mark 4 — Peace, Be Still", "verse": "When Jesus gave the order to cross, He already knew the storm was coming.", "life": "Jesus isn’t shocked by your storm. He is with you in it."},
      {"lesson": "Peace, Be Still", "q": "According to the lesson, when anxiety rises in a storm, what should we do instead of fighting it alone?", "answers": [{"text": "Distract ourselves with more entertainment", "correct": false}, {"text": "Bring our requests to God in prayer and let His peace guard our hearts and minds", "correct": true}, {"text": "Avoid every hard situation for the rest of life", "correct": false}, {"text": "Rely only on positive thinking with no prayer", "correct": false}], "ref": "Philippians 4:6–7 — Peace, Be Still", "verse": "“…and the peace of God, which surpasses all understanding, will guard your hearts and minds through Christ Jesus.”", "life": "Put your worries on the Lord. Let His peace surround you while you face the storm."},

      {"lesson": "When You Fail but God Isn't Finished", "q": "In When You Fail but God Isn’t Finished, what picture does the lesson use for how God helps us after we fall?", "answers": [{"text": "A coach who benches you forever", "correct": false}, {"text": "Parents helping a baby who falls while learning to walk—then getting back up", "correct": true}, {"text": "A judge who never allows a second try", "correct": false}, {"text": "A Snapchat streak that can never restart", "correct": false}], "ref": "Proverbs 24:16 — When You Fail", "verse": "“For a righteous man may fall seven times and rise again, but the wicked shall fall by calamity.”", "life": "Falling isn’t the end. The righteous are people who don’t stay down."},
      {"lesson": "When You Fail but God Isn't Finished", "q": "According to the lesson, what often stops us from even trying after we’ve failed?", "answers": [{"text": "Too much free time", "correct": false}, {"text": "Fear of failing again—while God says He will strengthen and uphold us", "correct": true}, {"text": "Having too many friends who encourage us", "correct": false}, {"text": "Knowing God has already finished with us", "correct": false}], "ref": "Isaiah 41:10 — When You Fail", "verse": "“Fear not, for I am with you… I will strengthen you, yes, I will help you, I will uphold you…”", "life": "Fear of failing can stop you from even trying. God says: I am with you—get up."},
      {"lesson": "When You Fail but God Isn't Finished", "q": "The lesson compares leaving sin unaddressed to what painful picture?", "answers": [{"text": "Leaving a book unfinished", "correct": false}, {"text": "Leaving a needle in your foot instead of pulling it out", "correct": true}, {"text": "Skipping breakfast once", "correct": false}, {"text": "Losing a game online", "correct": false}], "ref": "When You Fail but God Isn’t Finished", "verse": "The longer we leave sin in, the more it hurts. The moment we deal with it, God brings relief.", "life": "Repent specifically. Don’t leave the “needle” in—bring it to God."},
      {"lesson": "When You Fail but God Isn't Finished", "q": "According to the lesson, who are the “righteous” who fall and rise again?", "answers": [{"text": "People who never make mistakes", "correct": false}, {"text": "People who repent, turn back to God, and don’t stay down—because of what Christ has done", "correct": true}, {"text": "Only church leaders who never struggle", "correct": false}, {"text": "Anyone who ignores sin and hopes it goes away", "correct": false}], "ref": "2 Corinthians 5:21 — When You Fail", "verse": "“For He made Him who knew no sin to be sin for us, that we might become the righteousness of God in Him.”", "life": "Your identity in Christ isn’t “finished failure”—it’s righteousness received by grace."},
      {"lesson": "When You Fail but God Isn't Finished", "q": "What does the lesson want you to remember when you feel ashamed after falling?", "answers": [{"text": "You are finished and should give up", "correct": false}, {"text": "You may fall, but you are not finished—God still upholds you with His hand", "correct": true}, {"text": "Other people must fix you before God will help", "correct": false}, {"text": "Falling doesn’t matter, so there’s no need to repent", "correct": false}], "ref": "Psalm 37:23–24 — When You Fail", "verse": "“Though he fall, he shall not be utterly cast down; for the LORD upholds him with His hand.”", "life": "You may fall, but you are not finished. God is still holding your hand."},

      {"lesson": "Wise Decisions in Small Things", "q": "According to Wise Decisions in Small Things, why do everyday choices matter so much?", "answers": [{"text": "They don’t—only career and college decisions count", "correct": false}, {"text": "Faithfulness in little things shapes character and prepares us for greater trust", "correct": true}, {"text": "Small choices never affect our future", "correct": false}, {"text": "God only watches the big public moments", "correct": false}], "ref": "Luke 16:10 — Wise Decisions in Small Things", "verse": "“Whoever can be trusted with very little can also be trusted with much…”", "life": "Small daily choices train you for bigger trust later."},
      {"lesson": "Wise Decisions in Small Things", "q": "In the widow’s offering story used in the lesson, what did Jesus notice that others overlooked?", "answers": [{"text": "That her coins were made of gold", "correct": false}, {"text": "Her faithfulness—she gave out of poverty, all she had to live on", "correct": true}, {"text": "That she gave the largest amount of money", "correct": false}, {"text": "That the rich people refused to give anything", "correct": false}], "ref": "Mark 12:41–44 — Wise Decisions", "verse": "“They all gave out of their wealth; but she, out of her poverty, put in everything—all she had to live on.”", "life": "God measures faithfulness, not the size of the gift."},
      {"lesson": "Wise Decisions in Small Things", "q": "According to the lesson on friendships, what danger comes from the wrong company?", "answers": [{"text": "You might become too generous", "correct": false}, {"text": "Bad company can corrupt good character", "correct": true}, {"text": "You will automatically become a better leader", "correct": false}, {"text": "You will never face peer pressure again", "correct": false}], "ref": "1 Corinthians 15:33 — Wise Decisions / Friendships", "verse": "“Do not be misled: ‘Bad company corrupts good character.’”", "life": "Choose friends who point you toward Jesus, not away from Him."},
      {"lesson": "Wise Decisions in Small Things", "q": "When the lesson talks about what we watch and listen to, what standard does it give for our minds?", "answers": [{"text": "Choose whatever is popular and trending", "correct": false}, {"text": "Fill your mind with what is true, noble, right, pure, lovely, admirable, excellent, and praiseworthy", "correct": true}, {"text": "Watch anything as long as it’s funny", "correct": false}, {"text": "Only copy whatever friends are into", "correct": false}], "ref": "Philippians 4:8 — Wise Decisions / What We Watch", "verse": "“…if anything is excellent or praiseworthy—think about such things.”", "life": "What enters your mind shapes your thoughts, attitudes, and actions."},
      {"lesson": "Wise Decisions in Small Things", "q": "According to the lesson, what is one practical way to train yourself to make wise decisions?", "answers": [{"text": "Guess quickly and never pause", "correct": false}, {"text": "Ask God for wisdom in faith, and pause to pray before deciding", "correct": true}, {"text": "Only ask friends and ignore God", "correct": false}, {"text": "Wait until you’re an adult before seeking wisdom", "correct": false}], "ref": "James 1:5–6 — Training for Wise Decisions", "verse": "“If any of you lacks wisdom, let him ask of God… and it will be given to him.”", "life": "Humble yourself and ask. God loves to give wisdom."},
      {"lesson": "Wise Decisions in Small Things", "q": "Which example from the lesson shows someone prepared for greater responsibility by being faithful in hard, hidden seasons?", "answers": [{"text": "Jonah running to Tarshish", "correct": false}, {"text": "Joseph staying faithful through slavery, false accusation, and prison before leading Egypt", "correct": true}, {"text": "The rich people giving large gifts at the temple", "correct": false}, {"text": "The disciples panicking in the boat", "correct": false}], "ref": "Genesis 39–41 — Wise Decisions", "verse": "Joseph was prepared for the palace because he was wise and faithful in the small things.", "life": "The question isn’t “What big thing can I do for God?” but “Will I honor God in today’s small decisions?”"}
    ];
    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        let t=a[i];a[i]=a[j];a[j]=t;
      }
      return a;
    }
    shuffle(quiz);
    let i=0,score=0;
    const p=progress,qel=question,ael=answers,lel=document.getElementById('lesson'),info=document.getElementById('info');
    function load(){
    p.textContent=`Question ${i+1} of ${quiz.length}`;
    qel.textContent=quiz[i].q;
    if(quiz[i].lesson){lel.style.display='block';lel.textContent='Lesson: '+quiz[i].lesson;}
    else{lel.style.display='none';lel.textContent='';}
    ael.innerHTML='';info.style.display='none';info.innerHTML='';next.style.display='none';
    shuffle(quiz[i].answers);
    quiz[i].answers.forEach(ans=>{
    let b=document.createElement('button');b.className='opt';b.textContent=ans.text;
    b.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    if(ans.correct){b.classList.add('correct');score++;}else{b.classList.add('wrong');document.querySelectorAll('.opt').forEach((x,k)=>{if(quiz[i].answers[k].correct)x.classList.add('correct');});}
    info.style.display='block';
    info.innerHTML=`<b>📖 ${quiz[i].ref}</b><br><em>${quiz[i].verse}</em><hr><b>💡 Life Lesson:</b> ${quiz[i].life}`;
    next.textContent = (i === quiz.length - 1) ? "See your score." : "Next Question";
    next.style.display='inline-block';
    };
    ael.appendChild(b);
    });
    }
    next.onclick=()=>{i++;if(i<quiz.length)load();else{
    document.querySelector('.q').style.display='none';lel.style.display='none';ael.style.display='none';info.style.display='none';next.style.display='none';p.style.display='none';
    let badge,comment;
    if(score>=24){
      badge="🌟 Lesson Champion";
      comment="You really listened in Teen Lessons. Keep walking in God’s design!";
    }else if(score>=15){
      badge="💪 Growing Disciple";
      comment="Solid grasp of the lessons. Review the ones you missed and live them out this week.";
    }else{
      badge="🌱 Keep Going";
      comment="Every disciple starts somewhere. Revisit the lessons, rise again, and try once more!";
    }
    result.innerHTML=`<h2>🎉 You scored ${score} / ${quiz.length}</h2>
    <h3>${badge}</h3>
    <p>${comment}</p>
    <h3>Challenge for This Week</h3>
    <ul><li>Trust God’s design when life feels messy.</li><li>Don’t run from what God asks—even when it’s hard.</li><li>Invite Jesus into one storm you’re facing.</li><li>If you’ve fallen, repent and get back up.</li><li>Honor God in one small decision today.</li></ul>
    <p><a class="home-btn" href="../index.html">WisdomHub</a></p>`;
    restart.style.display='inline-block';
    }};
    restart.onclick=()=>location.reload();
    load();
    </script></body></html>
