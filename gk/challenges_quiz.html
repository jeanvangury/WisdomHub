```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Will You Fare in a Challenge?</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 15px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
}

.progress-container {
    width: 100%;
    background: #ddd;
    border-radius: 20px;
    margin-bottom: 20px;
}

.progress-bar {
    height: 12px;
    width: 0%;
    background: #4caf50;
    border-radius: 20px;
    transition: 0.3s;
}

.question-number {
    color: #666;
    margin-bottom: 10px;
}

.question {
    font-size: 1.3rem;
    margin-bottom: 25px;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

button.option-btn {
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e8edf3;
    font-size: 1rem;
}

button.option-btn:hover {
    background: #d6e3f3;
}

.result {
    display: none;
}

.score-box {
    background: #f5f5f5;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}

.restart {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    background: #4caf50;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="container">

<h1>How Will You Fare in a Challenge?</h1>

<div id="quiz">

<div class="progress-container">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="questionNumber" class="question-number"></div>

<div id="questionText" class="question"></div>

<div class="options" id="options"></div>

</div>

<div id="result" class="result">
<h2>Your Results</h2>

<h3 id="resultTitle"></h3>
<p id="resultDescription"></p>

<div class="score-box">
<strong>Total Score:</strong>
<span id="totalScore"></span>
</div>

<div class="score-box">
<h4>Challenge Profile</h4>
<p>Stability: <span id="stability"></span></p>
<p>Anger: <span id="anger"></span></p>
<p>Panic: <span id="panic"></span></p>
<p>Resignation: <span id="resignation"></span></p>
</div>

<div class="score-box">
<h4>Growth Focus</h4>
<p id="growthFocus"></p>
</div>

<button class="restart" onclick="location.reload()">
Take Quiz Again
</button>
</div>

</div>

<script>

const questions = [

"When something unexpected goes wrong, I stay calm long enough to think clearly.",

"I immediately imagine the worst possible outcome.",

"I can accept reality even when I don't like it.",

"My emotions usually control my first response to a crisis.",

"I look for the next practical step instead of freezing.",

"When treated unfairly, I become critical of everyone around me.",

"I can disagree without becoming combative.",

"I tend to expect the worst from people after being hurt.",

"I hold onto resentment for a long time.",

"I can choose restraint even when I feel justified in fighting back.",

"In a crisis, I focus on what I can control.",

"I become overwhelmed by 'what if' scenarios.",

"I can take action even when I don't have all the answers.",

"Fear often stops me from making decisions.",

"I am able to regain perspective after a setback.",

"After repeated setbacks, I still believe improvement is possible.",

"I sometimes feel like giving up entirely.",

"I keep moving forward even when progress feels slow.",

"I can ask others for help when I need it.",

"Even during difficulties, I can find reasons to be grateful."

];

const reverseQuestions = [1,3,5,7,8,11,13,16];

let currentQuestion = 0;
let answers = [];

const questionText = document.getElementById("questionText");
const optionsDiv = document.getElementById("options");
const questionNumber = document.getElementById("questionNumber");
const progressBar = document.getElementById("progressBar");

function loadQuestion() {

    questionNumber.innerHTML =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    progressBar.style.width =
        ((currentQuestion) / questions.length) * 100 + "%";

    questionText.textContent = questions[currentQuestion];

    optionsDiv.innerHTML = "";

    const labels = [
        "1 - Never",
        "2 - Rarely",
        "3 - Sometimes",
        "4 - Often",
        "5 - Almost Always"
    ];

    labels.forEach((label,index)=>{

        const btn = document.createElement("button");

        btn.className = "option-btn";

        btn.textContent = label;

        btn.onclick = () => saveAnswer(index + 1);

        optionsDiv.appendChild(btn);
    });
}

function saveAnswer(score){

    answers.push(score);

    currentQuestion++;

    if(currentQuestion < questions.length){
        loadQuestion();
    } else {
        showResults();
    }
}

function adjustedScore(index, value){

    if(reverseQuestions.includes(index)){
        return 6 - value;
    }

    return value;
}

function showResults(){

    let total = 0;

    let adjusted = answers.map((a,i)=>{
        const s = adjustedScore(i,a);
        total += s;
        return s;
    });

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("totalScore").innerText = total;

    let title = "";
    let description = "";

    if(total >= 85){

        title = "Resilient Overcomer";

        description =
        "You demonstrate strong hope, faith, confidence, and resilience during difficult seasons.";

    } else if(total >= 65){

        title = "Growing Through Challenges";

        description =
        "You have a healthy foundation but still experience occasional fear, frustration, or discouragement.";

    } else if(total >= 45){

        title = "Stuck in Reaction Mode";

        description =
        "Challenges tend to trigger emotional reactions that may keep you trapped longer than necessary.";

    } else {

        title = "At Risk of Giving Up";

        description =
        "Challenges may currently feel overwhelming and may be affecting your confidence and resilience.";

    }

    document.getElementById("resultTitle").innerText = title;
    document.getElementById("resultDescription").innerText = description;

    const stability =
        adjusted.slice(0,5).reduce((a,b)=>a+b,0);

    const anger =
        adjusted.slice(5,10).reduce((a,b)=>a+b,0);

    const panic =
        adjusted.slice(10,15).reduce((a,b)=>a+b,0);

    const resignation =
        adjusted.slice(15,20).reduce((a,b)=>a+b,0);

    document.getElementById("stability").innerText = stability + "/25";
    document.getElementById("anger").innerText = anger + "/25";
    document.getElementById("panic").innerText = panic + "/25";
    document.getElementById("resignation").innerText = resignation + "/25";

    const scores = {
        "Choose Restraint": anger,
        "Take the Next Step": panic,
        "Don't Stay Down": resignation,
        "Strengthen Your Foundation": stability
    };

    let lowestKey = Object.keys(scores)[0];

    Object.keys(scores).forEach(key=>{
        if(scores[key] < scores[lowestKey]){
            lowestKey = key;
        }
    });

    document.getElementById("growthFocus").innerText = lowestKey;
}

loadQuestion();

</script>

</body>
</html>
