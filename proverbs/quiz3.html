function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    let t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function bandFor(got, total){
  if(got===total) return {label:"Good", cls:"band-good"};
  if(got===total-1) return {label:"Average", cls:"band-avg"};
  return {label:"Weak", cls:"band-weak"};
}
function sectionScorecard(){
  const rows=sections.map(sec=>{
    const qs=quiz.filter(q=>sec.refs.includes(q.ref));
    const got=qs.filter(q=>q.got).length;
    const total=sec.refs.length;
    const band=bandFor(got,total);
    return {name:sec.name, got, total, band};
  });
  const table=rows.map(r=>`<tr class="${r.band.cls}"><td>${r.name}</td><td>${r.got} / ${r.total}</td><td>${r.band.label}</td></tr>`).join("");
  const weak=rows.filter(r=>r.band.label==="Weak").map(r=>r.name);
  const focus=weak.length
    ? `<p><b>Focus this week:</b> ${weak.join("; ")}.</p>`
    : `<p><b>Focus this week:</b> Keep walking in the themes that are already strong, and share one insight with someone else.</p>`;
  return `<h3>Scorecard by theme</h3>
  <p class="legend"><b class="good">Good</b> = 3/3 &nbsp;·&nbsp; <b class="avg">Average</b> = 2/3 &nbsp;·&nbsp; <b class="weak">Weak</b> = 0–1/3</p>
  <table class="scorecard">
    <thead><tr><th>Theme</th><th>Score</th><th>Rating</th></tr></thead>
    <tbody>${table}</tbody>
  </table>
  ${focus}`;
}

  info.style.display='block';
  info.innerHTML=`<b>📖 ${quiz[i].ref}</b><br><em>${quiz[i].verse}</em><hr><b>💡 Life Lesson:</b> ${quiz[i].life}`;
  next.textContent = (i === quiz.length - 1) ? "See your score." : "Next Question";
  next.style.display='inline-block';
}
function load(){
  tries=0;
  p.textContent=`Question ${i+1} of ${quiz.length}`;
  qel.textContent=quiz[i].q;ael.innerHTML='';info.style.display='none';info.innerHTML='';next.style.display='none';
  shuffle(quiz[i].answers);
  quiz[i].answers.forEach((ans, idx)=>{
    let b=document.createElement('button');b.className='opt';
    let letter=document.createElement('b');letter.textContent=letters[idx]+'. ';
    b.appendChild(letter);b.appendChild(document.createTextNode(ans.text));
    b.onclick=()=>{
      if(ans.correct){
        b.classList.add('correct');
        quiz[i].got=true;
        score++;
        reveal();
      } else {
        b.classList.add('wrong');
        b.disabled=true;
        tries++;
        if(tries===1){
          info.style.display='block';
          info.innerHTML='<b>Pass this question to the next person.</b><br>That option is out. The question is still open — someone else should choose from the remaining answers.';
          next.style.display='none';
        } else {
          reveal();
        }
      }
    };
    ael.appendChild(b);
  });
}
next.onclick=()=>{i++;if(i<quiz.length)load();else{
  document.querySelector('.q').style.display='none';ael.style.display='none';info.style.display='none';next.style.display='none';p.style.display='none';
  result.innerHTML=`<h2>🎉 You scored ${score} / ${quiz.length}</h2>
  ${sectionScorecard()}
  <h3>Challenge for This Week</h3>
  <ul>
    <li>Seek wisdom and hate folly: receive one correction instead of defending yourself.</li>
    <li>Watch your tongue and your temper: restrain one habitual reaction in speech or anger.</li>
    <li>Work with open hands: be diligent, generous, and honest in one money or work decision.</li>
    <li>Honor family and choose friends carefully: repair one relationship or step back from a snare.</li>
    <li>Fear the Lord in public and private: let reverence show up as humility and integrity.</li>
  </ul>
  <p><a class="home-btn" href="../index.html">WisdomHub</a></p>`;
  restart.style.display='inline-block';
}};
restart.onclick=()=>location.reload();
load();
</script>
</body>
</html>
